<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grant Advisor — Granted Consulting</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #chat-container {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    #chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e8e8e8;
      background: #ffffff;
      flex-shrink: 0;
    }

    #chat-header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
    }

    #chat-header p {
      font-size: 13px;
      color: #666;
      margin-top: 2px;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-content {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.user .message-content {
      background: #1B6B4A;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .message-content {
      background: #f0f0f0;
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
    }

    /* Thinking / typing indicator */
    .thinking-indicator {
      align-self: flex-start;
    }

    .thinking-dots {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 12px 16px;
      background: #f0f0f0;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }

    .thinking-dot {
      width: 7px;
      height: 7px;
      background: #999;
      border-radius: 50%;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 60%, 100% { opacity: 0.3; transform: scale(1); }
      30% { opacity: 1; transform: scale(1.2); }
    }

    #input-area {
      padding: 12px 16px;
      border-top: 1px solid #e8e8e8;
      background: #ffffff;
      flex-shrink: 0;
    }

    #input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    #message-input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.4;
      max-height: 120px;
      overflow-y: auto;
      transition: border-color 0.15s;
    }

    #message-input:focus {
      border-color: #1B6B4A;
    }

    #message-input::placeholder {
      color: #aaa;
    }

    #send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: #1B6B4A;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, opacity 0.15s;
    }

    #send-btn:hover:not(:disabled) {
      background: #155a3c;
    }

    #send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #send-btn svg {
      width: 16px;
      height: 16px;
    }

    #chat-footer {
      text-align: center;
      padding: 8px 16px 12px;
      font-size: 11px;
      color: #bbb;
      flex-shrink: 0;
    }

    /* Error state */
    .error-message {
      align-self: center;
      font-size: 13px;
      color: #c0392b;
      background: #fdecea;
      padding: 8px 14px;
      border-radius: 8px;
      text-align: center;
    }

    @media (min-width: 600px) {
      body {
        padding: 20px 0;
      }
      #chat-container {
        height: calc(100vh - 40px);
        max-height: 800px;
        border-radius: 12px;
        overflow: hidden;
      }
    }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="chat-header">
    <h1>Grant Advisor</h1>
    <p>Find out what grants your business could qualify for — in about 2 minutes.</p>
  </div>

  <div id="chat-messages"></div>

  <div id="input-area">
    <div id="input-row">
      <textarea
        id="message-input"
        placeholder="Type a message..."
        rows="1"
        maxlength="500"
      ></textarea>
      <button id="send-btn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <div id="chat-footer">Powered by Granted Consulting</div>
</div>

<script>
  // ============================================================
  // State
  // ============================================================
  let sessionId = null;
  let isStreaming = false;

  // ============================================================
  // DOM refs
  // ============================================================
  const chatMessages = document.getElementById('chat-messages');
  const messageInput = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');

  // ============================================================
  // UI helpers
  // ============================================================

  function addMessageToUI(role, text) {
    const wrapper = document.createElement('div');
    wrapper.className = `message ${role}`;

    const content = document.createElement('div');
    content.className = 'message-content';
    content.textContent = text;

    wrapper.appendChild(content);
    chatMessages.appendChild(wrapper);
    scrollToBottom();
    return wrapper;
  }

  function addThinkingIndicator() {
    const indicator = document.createElement('div');
    indicator.className = 'thinking-indicator';
    indicator.innerHTML = `
      <div class="thinking-dots">
        <div class="thinking-dot"></div>
        <div class="thinking-dot"></div>
        <div class="thinking-dot"></div>
      </div>`;
    chatMessages.appendChild(indicator);
    scrollToBottom();
    return indicator;
  }

  function addErrorMessage(text) {
    const el = document.createElement('div');
    el.className = 'error-message';
    el.textContent = text;
    chatMessages.appendChild(el);
    scrollToBottom();
  }

  function scrollToBottom() {
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function setInputEnabled(enabled) {
    messageInput.disabled = !enabled;
    sendBtn.disabled = !enabled;
    if (enabled) messageInput.focus();
  }

  // Auto-grow textarea
  messageInput.addEventListener('input', () => {
    messageInput.style.height = 'auto';
    messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
  });

  // ============================================================
  // Core: send a message and stream the response
  // ============================================================

  async function sendMessage(text, isHidden = false) {
    if (isStreaming) return;
    if (!text.trim()) return;

    isStreaming = true;
    setInputEnabled(false);

    // Show user bubble (skip for the silent init message)
    if (!isHidden) {
      addMessageToUI('user', text.trim());
    }

    const thinkingIndicator = addThinkingIndicator();
    let assistantWrapper = null;
    let assistantText = '';

    try {
      const body = { message: text };
      if (sessionId) body.session_id = sessionId;

      console.log('[LeadGen] Sending message. session_id:', sessionId || '(none — new session)');

      const response = await fetch('/api/lead-gen/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (!response.ok) {
        thinkingIndicator.remove();
        const errData = await response.json().catch(() => ({}));
        addErrorMessage(errData.error || 'Something went wrong. Please try again.');
        return;
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete line

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (!raw) continue;

          let parsed;
          try {
            parsed = JSON.parse(raw);
          } catch {
            continue;
          }

          // Session ID from server — read conversationId (the lead-gen session UUID).
          // The server also sends sessionId but that's a per-request UUID, not what we need.
          if (parsed.type === 'connected' && parsed.conversationId) {
            sessionId = parsed.conversationId;
            console.log('[LeadGen] session_id received from connected event:', sessionId);
          }

          // Streaming text
          if (parsed.type === 'text_delta' && parsed.text) {
            if (!assistantWrapper) {
              thinkingIndicator.remove();
              assistantWrapper = addMessageToUI('assistant', '');
            }
            assistantText += parsed.text;
            assistantWrapper.querySelector('.message-content').textContent = assistantText;
            scrollToBottom();
          }

          // Done event
          if (parsed.type === 'done') {
            if (!assistantWrapper && assistantText === '') {
              thinkingIndicator.remove();
            }
          }

          // Error from server stream
          if (parsed.type === 'error') {
            thinkingIndicator.remove();
            addErrorMessage(parsed.message || 'An error occurred.');
          }
        }
      }

      // Flush remaining buffer
      if (buffer.startsWith('data: ')) {
        const raw = buffer.slice(6).trim();
        try {
          const parsed = JSON.parse(raw);
          if (parsed.type === 'text_delta' && parsed.text) {
            if (!assistantWrapper) {
              thinkingIndicator.remove();
              assistantWrapper = addMessageToUI('assistant', '');
            }
            assistantText += parsed.text;
            assistantWrapper.querySelector('.message-content').textContent = assistantText;
          }
        } catch { /* ignore */ }
      }

      // If thinking indicator is still there (no response came back), remove it
      if (thinkingIndicator.parentNode) {
        thinkingIndicator.remove();
      }

    } catch (err) {
      if (thinkingIndicator.parentNode) thinkingIndicator.remove();
      addErrorMessage('Connection error. Please check your connection and try again.');
      console.error('Chat error:', err);
    } finally {
      isStreaming = false;
      setInputEnabled(true);
      messageInput.style.height = 'auto';
    }
  }

  // ============================================================
  // Event listeners
  // ============================================================

  sendBtn.addEventListener('click', () => {
    const text = messageInput.value;
    messageInput.value = '';
    sendMessage(text);
  });

  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const text = messageInput.value;
      messageInput.value = '';
      sendMessage(text);
    }
  });

  // ============================================================
  // Auto-init: send a silent greeting to get the opening message
  // ============================================================
  (async function init() {
    setInputEnabled(false);
    await sendMessage('hello', true);
    setInputEnabled(true);
  })();
</script>

</body>
</html>
