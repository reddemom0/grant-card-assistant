<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Metrics - Granted AI</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Shared Layout Styles -->
    <link rel="stylesheet" href="/public/css/shared-layout.css">

    <style>
        .metrics-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            margin-bottom: 2rem;
        }

        .page-header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .page-header .subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .time-filter {
            display: flex;
            gap: 0.5rem;
            background: var(--surface);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid var(--border);
        }

        .time-filter button {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-primary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            font-family: 'Montserrat', sans-serif;
        }

        .time-filter button:hover {
            background: var(--background);
            border-color: var(--primary-cyan);
        }

        .time-filter button.active {
            background: linear-gradient(135deg, var(--primary-cyan) 0%, var(--secondary-teal) 100%);
            color: white;
            border-color: var(--primary-cyan);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }

        .stat-card:hover {
            border-color: var(--primary-cyan);
            box-shadow: 0 4px 12px rgba(54, 202, 250, 0.1);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
        }

        .stat-sublabel {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .section {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 0.75rem;
            background: var(--background);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1rem 0.75rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: var(--background);
        }

        .score-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .score-excellent {
            background: rgba(54, 202, 250, 0.1);
            color: var(--primary-cyan);
        }

        .score-good {
            background: rgba(38, 196, 182, 0.1);
            color: var(--secondary-teal);
        }

        .score-fair {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }

        .score-poor {
            background: rgba(214, 69, 80, 0.1);
            color: var(--coral-red);
        }

        .loading {
            text-align: center;
            padding: 4rem 0;
            color: var(--text-secondary);
        }

        .loading-spinner {
            display: inline-block;
            width: 3rem;
            height: 3rem;
            border: 3px solid var(--border);
            border-top-color: var(--primary-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="metrics-container">
        <div class="page-header">
            <h1>📊 Feedback & Quality Metrics</h1>
            <p class="subtitle">Track agent performance and user feedback trends</p>
        </div>

        <div class="time-filter">
            <button onclick="setTimeRange(1)">Last 24 Hours</button>
            <button class="active" onclick="setTimeRange(7)">7 Days</button>
            <button onclick="setTimeRange(30)">One Month</button>
            <button onclick="setTimeRange(90)">Three Months</button>
        </div>

        <div id="summary-stats"></div>
        <div id="agent-quality"></div>
    </div>

    <script>
        console.log('📊 Feedback Metrics loaded');

        let currentDays = 7;

        async function setTimeRange(days) {
            currentDays = days;

            document.querySelectorAll('.time-filter button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            await loadAllData();
        }

        async function loadAllData() {
            await Promise.all([
                loadSummaryStats(),
                loadAgentQuality()
            ]);
        }

        async function loadSummaryStats() {
            const container = document.getElementById('summary-stats');
            container.innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>';

            try {
                const response = await fetch(`/api/feedback-metrics?days=${currentDays}`, {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Failed to load metrics');
                }

                const data = await response.json();

                container.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">Total Feedback</div>
                            <div class="stat-value">${data.totalFeedback || 0}</div>
                            <div class="stat-sublabel">Across all agents</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Positive Rate</div>
                            <div class="stat-value">${data.positiveRate || 0}%</div>
                            <div class="stat-sublabel">${data.positiveCount || 0} positive reactions</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Average Quality</div>
                            <div class="stat-value">${data.avgQuality || 'N/A'}</div>
                            <div class="stat-sublabel">Out of 5.0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Response Time</div>
                            <div class="stat-value">${data.avgResponseTime || 'N/A'}s</div>
                            <div class="stat-sublabel">Average across agents</div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading summary stats:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <p>Error loading metrics</p>
                    </div>
                `;
            }
        }

        async function loadAgentQuality() {
            const container = document.getElementById('agent-quality');
            container.innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>';

            try {
                const response = await fetch(`/api/agent-quality?days=${currentDays}`, {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Failed to load agent quality');
                }

                const data = await response.json();

                if (!data.agents || data.agents.length === 0) {
                    container.innerHTML = `
                        <div class="section">
                            <h2 class="section-title">🤖 Agent Performance</h2>
                            <div class="empty-state">
                                <div class="empty-state-icon">📊</div>
                                <p>No feedback data available for this time period</p>
                            </div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div class="section">
                        <h2 class="section-title">🤖 Agent Performance</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>Agent</th>
                                    <th>Total Feedback</th>
                                    <th>Positive Rate</th>
                                    <th>Avg Quality</th>
                                    <th>Response Time</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.agents.map(agent => {
                                    const qualityScore = agent.avgQuality || 0;
                                    const qualityClass = qualityScore >= 4.5 ? 'excellent' :
                                                        qualityScore >= 4.0 ? 'good' :
                                                        qualityScore >= 3.0 ? 'fair' : 'poor';

                                    return `
                                        <tr style="cursor: pointer;" onclick="viewAgentDetails('${agent.agentType}')">
                                            <td style="font-weight: 600;">${formatAgentName(agent.agentType)}</td>
                                            <td>${agent.totalFeedback || 0}</td>
                                            <td>${agent.positiveRate || 0}%</td>
                                            <td>${agent.avgQuality || 'N/A'}</td>
                                            <td>${agent.avgResponseTime || 'N/A'}s</td>
                                            <td>
                                                <span class="score-badge score-${qualityClass}">
                                                    ${qualityClass.charAt(0).toUpperCase() + qualityClass.slice(1)}
                                                </span>
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading agent quality:', error);
                container.innerHTML = `
                    <div class="section">
                        <h2 class="section-title">🤖 Agent Performance</h2>
                        <div class="empty-state">
                            <div class="empty-state-icon">⚠️</div>
                            <p>Error loading agent performance data</p>
                        </div>
                    </div>
                `;
            }
        }

        function formatAgentName(agentType) {
            const names = {
                'etg-writer': 'ETG Business Case',
                'grant-card-generator': 'Grant Card Generator',
                'canexport-claims': 'CanExport Claims',
                'bcafe-writer': 'BCAFE Applications',
                'readiness-strategist': 'Readiness Strategist',
                'canexport-writer': 'CanExport Writer',
                'buybc-writer': 'Buy BC Partnership',
                'internal-oracle': 'Team Oracle'
            };
            return names[agentType] || agentType;
        }

        function viewAgentDetails(agentType) {
            console.log('View details for:', agentType);
            // TODO: Implement agent details modal
        }

        // Load data on page load
        loadAllData();
    </script>

    <!-- Shared Layout Script -->
    <script src="/public/js/shared-layout.js"></script>
</body>
</html>
