<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title id="page-title">Team Oracle - Granted AI</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Shared Layout Styles -->
    <link rel="stylesheet" href="/public/css/shared-layout.css">

    <style>
        /* Agent-specific welcome screen */
        .welcome-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 4rem 2rem 12rem 2rem;
            text-align: center;
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            padding: 20px;
            background: linear-gradient(135deg, rgba(54, 202, 250, 0.1) 0%, rgba(38, 196, 182, 0.05) 100%);
            border: 1px solid rgba(54, 202, 250, 0.2);
            border-radius: 20px;
            color: var(--primary-cyan);
            box-shadow: 0 8px 24px rgba(54, 202, 250, 0.15),
                        0 0 0 1px rgba(54, 202, 250, 0.1) inset;
        }

        .welcome-icon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 2px 4px rgba(54, 202, 250, 0.3));
        }

        .welcome-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.75rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.1s backwards;
        }

        .welcome-subtitle {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            line-height: 1.6;
            font-weight: 500;
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.2s backwards;
        }

        .welcome-prompts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .welcome-prompt {
            padding: 1.25rem;
            background: linear-gradient(135deg, rgba(54, 202, 250, 0.03) 0%, rgba(38, 196, 182, 0.02) 100%);
            border: 1px solid var(--border);
            border-left: 3px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
            position: relative;
            overflow: hidden;
            animation: slideInFromBottom 0.5s cubic-bezier(0.4, 0, 0.2, 1) backwards;
        }

        @keyframes slideInFromBottom {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-prompt:nth-child(1) { animation-delay: 0.3s; }
        .welcome-prompt:nth-child(2) { animation-delay: 0.4s; }
        .welcome-prompt:nth-child(3) { animation-delay: 0.5s; }

        .welcome-prompt::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, var(--primary-cyan) 0%, var(--teal) 100%);
            transform: scaleY(0);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom;
        }

        .welcome-prompt:hover {
            background: linear-gradient(135deg, rgba(54, 202, 250, 0.08) 0%, rgba(38, 196, 182, 0.05) 100%);
            border-color: rgba(54, 202, 250, 0.3);
            border-left-color: var(--primary-cyan);
            box-shadow: 0 8px 24px rgba(54, 202, 250, 0.2),
                        0 0 0 1px rgba(54, 202, 250, 0.1) inset;
        }

        .welcome-prompt:hover::before {
            transform: scaleY(1);
            transform-origin: top;
        }

        .welcome-prompt:active {
            transform: scale(0.98);
        }

        .welcome-prompt-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.9375rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .welcome-prompt-description {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.5;
            font-weight: 500;
        }

        /* Chat container */
        .chat-wrapper {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
            max-width: 900px;
            margin: 0 auto;
            padding: 0 2rem 10rem 2rem;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 0;
        }

        .chat-input-container {
            position: fixed;
            bottom: 0;
            left: 240px;
            right: 0;
            padding: 2rem;
            background: transparent;
            border-top: none;
            z-index: 100;
            pointer-events: none;
        }

        .chat-input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2),
                        0 0 0 1px rgba(54, 202, 250, 0.1) inset;
            backdrop-filter: blur(12px);
            pointer-events: auto;
        }

        .message {
            margin-bottom: 2.5rem;
            animation: messageSlideIn 0.3s ease-out;
            max-width: 100%;
        }

        @keyframes messageSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-role {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8125rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            color: var(--text-tertiary);
        }

        .message.user {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .message.user .message-content {
            max-width: 70%;
            background: rgba(0, 0, 0, 0.04);
            padding: 1rem 1.25rem;
            border-radius: 16px 16px 4px 16px;
        }

        .message-role {
            display: none;
        }

        .message-content {
            padding: 0;
            background: transparent;
            border: none;
            line-height: 1.7;
            font-size: 0.9375rem;
            color: var(--text-primary);
        }

        .message.user .message-content {
            opacity: 0.9;
        }

        /* Hover-only feedback buttons */
        .message-feedback-inline {
            opacity: 0 !important;
            animation: none !important;
            transition: opacity 150ms ease;
            border-top: none !important;
        }

        .message.assistant:hover .message-feedback-inline {
            opacity: 1 !important;
        }

        .message.assistant .message-content {
            padding-left: 0;
            border-left: none;
        }

        /* Markdown formatting within messages */
        .message-content p {
            margin: 0 0 1.25rem 0;
            line-height: 1.7;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        .message-content strong {
            font-weight: 700;
            color: var(--text-primary);
        }

        .message-content em {
            font-style: italic;
            color: var(--text-secondary);
        }

        .message-content h1,
        .message-content h2,
        .message-content h3 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            margin: 1.5rem 0 1rem 0;
            color: var(--text-primary);
        }

        .message-content h1 {
            font-size: 1.5rem;
        }

        .message-content h2 {
            font-size: 1.25rem;
        }

        .message-content h3 {
            font-size: 1.0625rem;
        }

        .message-content ul,
        .message-content ol {
            margin: 1rem 0;
            padding-left: 1.5rem;
        }

        .message-content li {
            margin: 0.5rem 0;
            line-height: 1.6;
        }

        .message-content code {
            background: rgba(54, 202, 250, 0.08);
            color: var(--primary-cyan);
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-size: 0.875em;
            font-weight: 500;
        }

        .message-content pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 1.25rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1.5rem 0;
            border: 1px solid var(--border);
        }

        .message-content pre code {
            background: none;
            color: var(--light-cyan);
            padding: 0;
            font-size: 0.875rem;
        }

        .message-content a {
            color: var(--primary-cyan);
            text-decoration: none;
            border-bottom: 1px solid rgba(54, 202, 250, 0.3);
            transition: border-color 0.2s;
        }

        .message-content a:hover {
            border-bottom-color: var(--primary-cyan);
        }

        /* Thinking indicator */
        .thinking-indicator {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            background: var(--surface);
            border: none;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            animation: messageSlideIn 0.3s ease-out;
        }

        /* Animated dots container */
        .thinking-dots {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .thinking-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary-cyan);
            animation: dotPulse 1.4s ease-in-out infinite;
        }

        .thinking-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .thinking-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.4;
            }
            50% {
                transform: scale(1.15);
                opacity: 1;
            }
        }

        .thinking-text {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            font-family: 'Open Sans', sans-serif;
        }

        .input-form {
            display: flex;
            gap: 0.75rem;
        }

        .message-input {
            flex: 1;
            padding: 1rem 1.25rem;
            background: rgba(54, 202, 250, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text);
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            resize: none;
            min-height: 44px;
            max-height: 200px;
            overflow-y: auto;
            overflow-x: hidden;
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .message-input:focus {
            outline: none;
            background: rgba(54, 202, 250, 0.05);
            border-color: var(--primary-cyan);
            box-shadow: 0 0 0 3px rgba(54, 202, 250, 0.1),
                        0 4px 12px rgba(54, 202, 250, 0.15);
        }

        .send-button {
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, var(--primary-cyan) 0%, var(--teal) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(54, 202, 250, 0.3);
            position: relative;
            overflow: hidden;
        }

        .send-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--teal) 0%, var(--primary-cyan) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .send-button:hover {
            box-shadow: 0 6px 20px rgba(54, 202, 250, 0.4);
        }

        .send-button:hover::before {
            opacity: 1;
        }

        .send-button:active {
            box-shadow: 0 2px 8px rgba(54, 202, 250, 0.3);
        }

        .send-button span {
            position: relative;
            z-index: 1;
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .send-button:disabled:hover {
            transform: none;
            box-shadow: none;
        }

        .send-button.hidden {
            display: none;
        }

        .stop-button {
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, var(--coral-red) 0%, #b83640 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(214, 69, 80, 0.3);
            display: none;
            align-items: center;
            gap: 0.5rem;
        }

        .stop-button.visible {
            display: flex;
        }

        .stop-button:hover {
            box-shadow: 0 6px 20px rgba(214, 69, 80, 0.4);
        }

        .stop-button:active {
            box-shadow: 0 2px 8px rgba(214, 69, 80, 0.3);
        }

        .stop-button svg {
            width: 16px;
            height: 16px;
        }

        /* File upload styles */
        .file-upload-button {
            padding: 0.75rem;
            background: rgba(54, 202, 250, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            position: relative;
        }

        .file-upload-button:hover {
            background: rgba(54, 202, 250, 0.08);
            border-color: var(--primary-cyan);
            color: var(--primary-cyan);
            box-shadow: 0 4px 12px rgba(54, 202, 250, 0.2);
        }

        .file-upload-button svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        .file-upload-button:hover svg {
            transform: none;
        }

        .file-input-hidden {
            display: none;
        }

        .selected-files {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .file-chip {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: linear-gradient(135deg, rgba(54, 202, 250, 0.08) 0%, rgba(38, 196, 182, 0.05) 100%);
            border: 1px solid rgba(54, 202, 250, 0.2);
            border-radius: 8px;
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 600;
            animation: slideInFromTop 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(54, 202, 250, 0.1);
        }

        @keyframes slideInFromTop {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .file-chip-icon {
            width: 16px;
            height: 16px;
            color: var(--primary-cyan);
            filter: drop-shadow(0 1px 2px rgba(54, 202, 250, 0.3));
        }

        .file-chip-name {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-primary);
        }

        .file-chip-remove {
            cursor: pointer;
            color: var(--text-tertiary);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            padding: 0.125rem;
            border-radius: 4px;
        }

        .file-chip-remove:hover {
            color: var(--coral-red);
            background: rgba(214, 69, 80, 0.1);
        }

        .file-chip-remove svg {
            width: 14px;
            height: 14px;
        }

        .hidden {
            display: none;
        }

        /* Responsive adjustments for sidebar collapse */
        @media (max-width: 1024px) {
            .chat-input-container {
                left: 70px;
            }
        }

        @media (max-width: 768px) {
            .chat-input-container {
                left: 0;
                padding: 1rem;
            }

            .chat-input-wrapper {
                border-radius: 12px;
                padding: 0.75rem;
            }
        }

        /* Tool-call pill indicators */
        .tool-pill-container {
            display: flex;
            flex-direction: column;
            margin-bottom: 0.75rem;
        }

        .tool-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.85rem;
            margin-bottom: 0.5rem;
            max-height: 2rem;
            background: linear-gradient(135deg, rgba(54, 202, 250, 0.08) 0%, rgba(38, 196, 182, 0.04) 100%);
            border: 1px solid rgba(54, 202, 250, 0.2);
            border-radius: 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.775rem;
            font-weight: 600;
            color: var(--text-secondary);
            width: fit-content;
            overflow: hidden;
            transition: opacity 250ms ease-out,
                        max-height 250ms ease-out,
                        padding 250ms ease-out,
                        margin 250ms ease-out,
                        border-width 250ms ease-out;
            animation: pillSlideIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes pillSlideIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tool-pill-icon {
            font-size: 0.85rem;
            line-height: 1;
        }

        .tool-pill-label {
            white-space: nowrap;
        }

        .tool-pill-check {
            font-size: 0.75rem;
            line-height: 1;
            color: rgba(74, 222, 128, 0.9);
        }

        .tool-pill.fading {
            opacity: 0;
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            margin: 0;
            border-width: 0;
        }

        /* New messages indicator */
        .new-messages-indicator {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.4rem 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 0.8125rem;
            font-weight: 500;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 200ms ease;
            z-index: 99;
            backdrop-filter: blur(8px);
        }

        .new-messages-indicator.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .new-messages-indicator:hover {
            border-color: var(--primary-cyan);
            color: var(--primary-cyan);
        }

        /* Granola connection toast (post-OAuth confirmation) */
        .granola-connect-toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.5rem 1.25rem;
            background: var(--surface);
            border: 1px solid var(--teal);
            border-radius: 20px;
            color: var(--teal);
            font-size: 0.875rem;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 200ms ease;
            z-index: 100;
            backdrop-filter: blur(8px);
        }
        .granola-connect-toast.visible { opacity: 1; }
        .granola-connect-toast.error {
            border-color: var(--coral-red);
            color: var(--coral-red);
        }

        /* Granola connect card on Oracle welcome screen */
        .granola-card-slot { display: contents; }
        .granola-card {
            margin: 2rem auto 0;
            max-width: 520px;
            padding: 1.25rem 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--surface);
            text-align: left;
            font-size: 0.9375rem;
            color: var(--text-primary);
        }
        .granola-card.unconnected {
            border-color: rgba(54, 202, 250, 0.25);
            background: linear-gradient(135deg, rgba(54, 202, 250, 0.04) 0%, rgba(38, 196, 182, 0.02) 100%);
        }
        .granola-card-title {
            font-weight: 600;
            font-size: 1rem;
            margin: 0 0 0.5rem;
            color: var(--primary-navy);
        }
        body:not(.light-mode) .granola-card-title { color: var(--text-primary); }
        .granola-card-body {
            color: var(--text-secondary);
            margin: 0 0 1rem;
            line-height: 1.5;
        }
        .granola-card-cta {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: var(--primary-cyan);
            color: var(--primary-navy);
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            text-decoration: none;
            transition: opacity 150ms ease;
        }
        .granola-card-cta:hover { opacity: 0.85; }
        .granola-card.connected {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .granola-card-connected-text { color: var(--teal); font-weight: 600; }
        .granola-card-connected-text small {
            color: var(--text-secondary);
            font-weight: 400;
            margin-left: 0.5rem;
        }
        .granola-card-disconnect {
            background: none;
            border: none;
            padding: 0.25rem 0.5rem;
            color: var(--text-tertiary);
            cursor: pointer;
            font-size: 1rem;
            border-radius: 6px;
            transition: all 150ms ease;
        }
        .granola-card-disconnect:hover {
            background: var(--bg);
            color: var(--coral-red);
        }
    </style>
</head>
<body>
    <!-- The shared-layout.js will inject sidebar and header here -->

    <!-- Welcome Screen (shown by default) -->
    <div id="welcome-screen" class="welcome-container">
        <!-- Will be populated by JS based on selected agent -->
    </div>

    <!-- Chat Interface (hidden until first message) -->
    <div id="chat-screen" class="chat-wrapper hidden">
        <div id="chat-messages" class="chat-messages"></div>
    </div>

    <!-- New messages indicator (for smart autoscroll) -->
    <div id="new-messages-indicator" class="new-messages-indicator" onclick="jumpToBottom()">&#8595; New messages</div>

    <!-- Granola connection toast (shown briefly after OAuth callback) -->

        function createToolPill(toolName, onFadeComplete) {
            const category = TOOL_CATEGORIES[toolName] || 'other';
            const icon = CATEGORY_ICONS[category];
            const label = TOOL_LABELS[toolName] || 'Working';

            const pill = document.createElement('div');
            pill.className = 'tool-pill';
            if (!TOOL_LABELS[toolName]) {
                pill.title = toolName;
            }
            pill.innerHTML = `
                <span class="tool-pill-icon">${icon}</span>
                <span class="tool-pill-label">${label}</span>
                <span class="tool-pill-check">\u2713</span>
            `;

            // After 700ms visible, fade + collapse over 250ms, then remove from DOM
            setTimeout(() => {
                pill.classList.add('fading');
                setTimeout(() => {
                    if (pill.parentNode) pill.remove();
                    if (onFadeComplete) onFadeComplete();
                }, 250);
            }, 700);

            return pill;
        }

        // Initialize

            console.log('[INIT] Starting initialization...');
            console.log('[INIT] Full URL:', window.location.href);
            console.log('[INIT] Pathname:', window.location.pathname);

            // Parse URL: /{agent}/new or /{agent}/chat/{conversationId}
            const pathParts = window.location.pathname.split('/').filter(p => p);
            console.log('[INIT] Path parts:', pathParts);

            const agentFromPath = pathParts[0];
            const routeType = pathParts[1]; // 'new' or 'chat'
            const conversationIdFromPath = pathParts[2];

            console.log('[INIT] Parsed - Agent:', agentFromPath, 'RouteType:', routeType, 'ConvID:', conversationIdFromPath);

            // Set current agent
            if (AGENTS[agentFromPath]) {
                currentAgent = agentFromPath;
                console.log('[INIT] Set current agent to:', currentAgent);
            } else {
                console.warn('[INIT] Agent not found:', agentFromPath, 'Available:', Object.keys(AGENTS));
            }

            // If conversation ID in URL, load it
            if (routeType === 'chat' && conversationIdFromPath) {
                conversationId = conversationIdFromPath;
                console.log('[INIT] Loading conversation from URL:', conversationId);
                loadConversation(conversationId);
            } else {
                console.log('[INIT] Showing welcome screen');
                // Show welcome screen for new chat
                renderWelcomeScreen();
            }

            // Granola toast on OAuth callback redirect (?granola=connected | ?granola=error)
            // The error variant is defensive — the current callback handler returns 500
            // rather than redirecting with an error param. If that ever changes, the toast
            // is ready.
            const qs = new URLSearchParams(window.location.search);
            const granolaParam = qs.get('granola');
            if (granolaParam === 'connected' || granolaParam === 'error') {
                showGranolaToast(granolaParam === 'connected'
                    ? { message: '✓ Granola connected', error: false }
                    : { message: '✗ Granola connection failed', error: true });
                qs.delete('granola');
                const newUrl = window.location.pathname + (qs.toString() ? '?' + qs.toString() : '');
                history.replaceState({}, '', newUrl);
            }

            // For Oracle, fetch connection status and update card (fire-and-forget).
            if (currentAgent === 'oracle') {
                fetchGranolaStatus();
            }

            setupEventListeners();
            console.log('[INIT] Initialization complete');
        }

        // ===== Granola UI helpers =====

        let granolaConnectionState = null; // { connected: bool, email?: string } | null = unknown/failed

        function escapeHtmlSimple(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function showGranolaToast({ message, error }) {
            const toast = document.getElementById('granola-connect-toast');
            if (!toast) return;
            toast.textContent = message;
            toast.classList.toggle('error', !!error);
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 4000);
        }

        async function fetchGranolaStatus() {
            try {
                const r = await fetch('/api/auth/granola/status', { credentials: 'include' });
                if (!r.ok) throw new Error('status: ' + r.status);
                granolaConnectionState = await r.json();
            } catch (err) {
                console.error('[granola] status fetch failed:', err);
                granolaConnectionState = null;
            }
            updateGranolaCard();
        }

        function updateGranolaCard() {
            const slot = document.getElementById('granola-card-slot');
            if (!slot) return;
            if (currentAgent !== 'oracle' || !granolaConnectionState) {
                slot.innerHTML = '';
                return;
            }
            slot.innerHTML = granolaConnectionState.connected
                ? renderGranolaConnected(granolaConnectionState)
                : renderGranolaUnconnected();
        }

        function renderGranolaUnconnected() {
            return `
                <div class="granola-card unconnected">
                    <p class="granola-card-title">\u{1F4D3} Connect Granola</p>
                    <p class="granola-card-body">Give Oracle access to your meeting notes so it can answer questions about your calls and pull action items.</p>
                    <a class="granola-card-cta" href="/api/auth/granola">Connect Granola</a>
                </div>
            `;
        }

        function renderGranolaConnected(state) {
            const email = state.email ? `<small>${escapeHtmlSimple(state.email)}</small>` : '';
            return `
                <div class="granola-card connected">
                    <span class="granola-card-connected-text">✓ Granola connected ${email}</span>
                    <button class="granola-card-disconnect" onclick="disconnectGranola()" title="Disconnect Granola">✕</button>
                </div>
            `;
        }

        window.disconnectGranola = async function() {
            if (!window.confirm('Disconnect Granola from Oracle?')) return;
            try {
                const r = await fetch('/api/auth/granola/disconnect', {
                    method: 'POST', credentials: 'include'
                });
                if (!r.ok) throw new Error('disconnect: ' + r.status);
            } catch (err) {
                console.error('[granola] disconnect failed:', err);
            }
            await fetchGranolaStatus();
        };

                dragOverlay.innerHTML = `

                    </div>

            let dragCounter = 0;

            // Prevent default drag behavior
            document.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
            });

            document.addEventListener('dragenter', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dragCounter++;
                if (e.dataTransfer.types.includes('Files')) {
                    dragOverlay.style.opacity = '1';
                    dragOverlay.style.pointerEvents = 'all';
                }
            });

            document.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dragCounter--;
                if (dragCounter === 0) {
                    dragOverlay.style.opacity = '0';
                    dragOverlay.style.pointerEvents = 'none';
                }
            });

            document.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dragCounter = 0;
                dragOverlay.style.opacity = '0';
                dragOverlay.style.pointerEvents = 'none';

                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    const files = Array.from(e.dataTransfer.files);
                    selectedFiles = [...selectedFiles, ...files];
                    renderSelectedFiles();

            });

        // Convert file to base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Send message to API
        async function sendMessage(message, files = []) {
            // Show chat screen (keep welcome visible - it will scroll up)
            const welcomeScreen = document.getElementById('welcome-screen');
            const chatScreen = document.getElementById('chat-screen');

            // On first message, hide welcome and show chat
            if (chatScreen.classList.contains('hidden')) {
                welcomeScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');
            }

            // Add user message to UI with files
            await addMessageToUI('user', message, files);

            // Show thinking indicator
            console.log('[SEND_MSG] About to add thinking indicator');
            const thinkingIndicator = addThinkingIndicator();
            console.log('[SEND_MSG] Thinking indicator reference:', thinkingIndicator);

            // Create abort controller for this request
            currentAbortController = new AbortController();

            // Show stop button, hide send button
            const stopButton = document.getElementById('stop-button');
            const sendButton = document.getElementById('send-button');
            const messageInput = document.getElementById('message-input');

            stopButton.classList.add('visible');
            sendButton.classList.add('hidden');
            messageInput.disabled = true;

            try {
                // Create conversation ID if needed (must be UUID for Postgres)
                const isFirstMessage = !conversationId;
                if (!conversationId) {
                    // Generate a proper UUID v4
                    conversationId = crypto.randomUUID();

                    // Initialize inline feedback system for this conversation
                    if (window.InlineFeedback && !inlineFeedback) {
                        inlineFeedback = new InlineFeedback(conversationId);
                        console.log('[FEEDBACK] Inline feedback initialized for conversation:', conversationId);
                    }

                    // Update URL to /agent/chat/{conversationId} on first message
                    window.history.pushState({}, '', `/${currentAgent}/chat/${conversationId}`);
                }

                // Process file attachments
                const attachments = [];
                if (files && files.length > 0) {
                    console.log(`[DEBUG] Processing ${files.length} file(s)...`);

                    for (const file of files) {
                        try {
                            const base64Data = await fileToBase64(file);
                            const attachment = {
                                filename: file.name,
                                data: base64Data
                            };

                            // Determine attachment type
                            if (file.type.startsWith('image/')) {
                                attachment.type = 'image';
                                attachment.mimeType = file.type;
                            } else if (file.type === 'application/pdf') {
                                attachment.type = 'pdf';
                                attachment.mimeType = 'application/pdf';
                            } else {
                                attachment.type = 'document';
                                attachment.mimeType = file.type || 'text/plain';
                            }

                            attachments.push(attachment);
                            console.log(`[DEBUG] Processed file: ${file.name} (${file.type})`);
                        } catch (error) {
                            console.error(`[DEBUG] Failed to process file ${file.name}:`, error);
                        }
                    }
                }

                console.log('[DEBUG] Sending message:', {
                    message: message.substring(0, 50),
                    conversationId,
                    currentAgent,
                    backendAgent: getBackendAgentType(currentAgent),
                    attachments: attachments.length
                });

                // Call API
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    credentials: 'include', // Send cookies with request
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message || 'Analyze the attached document(s).',
                        conversationId,
                        agentType: getBackendAgentType(currentAgent),
                        attachments
                    }),
                    signal: currentAbortController.signal
                });

                console.log('[DEBUG] Response received:', response.status, response.ok);

                if (!response.ok) {
                    throw new Error('Failed to send message');
                }

                // Read streaming response with tool-call pills + text suppression
                // Phase 1 (before any tool calls): buffer text silently
                // Phase 2 (after first tool call): stream text live (it's the final response)
                // On tool_use_complete: discard any text, show pill, return to pill state
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let sseBuffer = '';          // Accumulates incomplete lines across chunks
                let assistantMessage = '';   // Currently-visible or buffered text
                let messageElement = null;   // The assistant chat bubble DOM element
                let pillContainer = null;    // Container for tool pills
                let hasSeenToolUse = false;  // Tracks whether we've entered tool-use phase
                let thinkingDoneForTurn = false; // Once true, thinking indicator never comes back

                while (true) {
                    const { done, value } = await reader.read();

                    if (done) {
                        // Flush decoder for any trailing multibyte sequence
                        sseBuffer += decoder.decode();
                        break;
                    }

                    sseBuffer += decoder.decode(value, { stream: true });

                    // Process only complete lines (terminated by \n)
                    const parts = sseBuffer.split('\n');
                    sseBuffer = parts.pop(); // Retain the incomplete trailing fragment

                    for (const line of parts) {
                        if (!line.startsWith('data: ')) continue;
                        const data = line.slice(6);
                        if (data === '[DONE]') continue;

                        try {
                            const parsed = JSON.parse(data);

                            // Text delta handling — behavior depends on phase
                            if (parsed.type === 'text_delta' && parsed.text) {
                                assistantMessage += parsed.text;

                                // Phase 2: after tool calls, stream text live
                                if (hasSeenToolUse) {
                                    // Final response text — permanently retire thinking indicator
                                    if (!thinkingDoneForTurn) {
                                        thinkingDoneForTurn = true;
                                        if (thinkingIndicator && thinkingIndicator.parentNode) {
                                            thinkingIndicator.remove();
                                        }
                                    }
                                    // Ensure bubble exists
                                    if (!messageElement) {
                                        messageElement = await addMessageToUI('assistant', '');
                                        // Move pill container into the bubble if it exists
                                        if (pillContainer) {
                                            const content = messageElement.querySelector('.message-content');
                                            content.prepend(pillContainer);
                                        }
                                    }

                                    // Render live
                                    const content = messageElement.querySelector('.message-content');
                                    // Preserve pill container, render text after it
                                    let textTarget = content.querySelector('.tool-response-text');
                                    if (!textTarget) {
                                        textTarget = document.createElement('div');
                                        textTarget.className = 'tool-response-text';
                                        content.appendChild(textTarget);
                                    }
                                    if (typeof marked !== 'undefined') {
                                        textTarget.innerHTML = marked.parse(assistantMessage);
                                    } else {
                                        textTarget.textContent = assistantMessage;
                                    }
                                    autoScroll();
                                }
                                // Phase 1: before any tool calls, text stays buffered (not rendered)
                            }

                            // Tool use complete — discard text, show pill
                            if (parsed.type === 'tool_use_complete' || parsed.type === 'server_tool_use_complete') {
                                hasSeenToolUse = true;

                                // Discard any buffered/rendered text (it was narration)
                                if (assistantMessage) {
                                    console.log('[SSE] Discarding narration:', assistantMessage.length, 'chars');
                                    assistantMessage = '';
                                }

                                // Clear rendered text from bubble if it exists
                                if (messageElement) {
                                    const textTarget = messageElement.querySelector('.tool-response-text');
                                    if (textTarget) textTarget.remove();
                                }

                                // Remove thinking indicator — pills replace it
                                if (thinkingIndicator && thinkingIndicator.parentNode) {
                                    thinkingIndicator.remove();
                                }

                                // Ensure pill container exists in the chat area
                                if (!pillContainer) {
                                    pillContainer = document.createElement('div');
                                    pillContainer.className = 'tool-pill-container';
                                    if (messageElement) {
                                        messageElement.querySelector('.message-content').prepend(pillContainer);
                                    } else {
                                        // Create the bubble to host pills
                                        messageElement = await addMessageToUI('assistant', '');
                                        messageElement.querySelector('.message-content').innerHTML = '';
                                        messageElement.querySelector('.message-content').appendChild(pillContainer);
                                    }
                                }

                                // Add pill (with callback to restore indicator when pill fades)
                                const toolName = parsed.toolName || 'unknown';
                                const pill = createToolPill(toolName, () => {
                                    if (!thinkingDoneForTurn && pillContainer && pillContainer.children.length === 0) {
                                        const chatMsgs = document.getElementById('chat-messages');
                                        if (thinkingIndicator && chatMsgs) {
                                            chatMsgs.appendChild(thinkingIndicator);
                                            autoScroll();
                                        }
                                    }
                                });
                                pillContainer.appendChild(pill);

                                autoScroll();
                            }

                        } catch (e) {
                            console.error('[DEBUG] Parse error:', e, 'for line:', line);
                        }
                    }
                }

                // Process any remaining complete lines left in the buffer after stream ends
                if (sseBuffer.trim()) {
                    const remainingLines = sseBuffer.split('\n');
                    for (const line of remainingLines) {
                        if (!line.startsWith('data: ')) continue;
                        const data = line.slice(6);
                        if (data === '[DONE]') continue;
                        try {
                            const parsed = JSON.parse(data);
                            if (parsed.type === 'text_delta' && parsed.text) {
                                assistantMessage += parsed.text;
                            }
                        } catch { /* discard incomplete trailing data */ }
                    }
                }

                // Stream ended — clean up
                if (thinkingIndicator && thinkingIndicator.parentNode) {
                    thinkingIndicator.remove();
                }

                // Safety net: if we have buffered text that was never rendered
                if (assistantMessage && !hasSeenToolUse) {
                    // No tools were called — render the buffered text as the response
                    messageElement = await addMessageToUI('assistant', '');
                    const content = messageElement.querySelector('.message-content');
                    if (typeof marked !== 'undefined') {
                        content.innerHTML = marked.parse(assistantMessage);
                    } else {
                        content.textContent = assistantMessage;
                    }
                    autoScroll();
                } else if (!messageElement && !assistantMessage) {
                    // Nothing received at all
                    addMessageToUI('assistant', 'No response received from the assistant.');
                }
            } catch (error) {
                // Handle abort separately from other errors
                if (error.name === 'AbortError') {
                    console.log('[DEBUG] Request was aborted by user');
                    // Remove thinking indicator on abort
                    if (thinkingIndicator && thinkingIndicator.parentNode) {
                        thinkingIndicator.remove();
                    }
                    // Optionally show a message that streaming was stopped
                    // addMessageToUI('assistant', '[Response stopped by user]');
                } else {
                    console.error('Error sending message:', error);
                    // Remove thinking indicator on error
                    if (thinkingIndicator && thinkingIndicator.parentNode) {
                        thinkingIndicator.remove();
                    }
                    addMessageToUI('assistant', 'Sorry, there was an error processing your message.');
                }
            } finally {
                // Clean up: hide stop button, show send button
                stopButton.classList.remove('visible');
                sendButton.classList.remove('hidden');
                messageInput.disabled = false;
                messageInput.focus();
                currentAbortController = null;
            }
        }

        // Load existing conversation from server
        async function loadConversation(convId) {
            console.log('[LOAD_CONV] Starting to load conversation:', convId);

            // Initialize inline feedback system for loaded conversation
            if (window.InlineFeedback && !inlineFeedback) {
                inlineFeedback = new InlineFeedback(convId);
                console.log('[FEEDBACK] Inline feedback initialized for loaded conversation:', convId);
            }

            try {
                const url = `/api/conversations/${convId}`;
                console.log('[LOAD_CONV] Fetching from:', url);

                const response = await fetch(url, {
                    credentials: 'include'
                });

                console.log('[LOAD_CONV] Response status:', response.status, response.statusText);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('[LOAD_CONV] Failed to load conversation. Status:', response.status);
                    console.error('[LOAD_CONV] Error response:', errorText);
                    renderWelcomeScreen();
                    return;
                }

                const data = await response.json();
                console.log('[LOAD_CONV] Received data:', data);
                console.log('[LOAD_CONV] Messages count:', data.messages?.length || 0);

                // Hide welcome, show chat
                const welcomeScreen = document.getElementById('welcome-screen');
                const chatScreen = document.getElementById('chat-screen');

                console.log('[LOAD_CONV] Welcome screen element:', welcomeScreen);
                console.log('[LOAD_CONV] Chat screen element:', chatScreen);

                welcomeScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');

                console.log('[LOAD_CONV] Toggled screen visibility');

                // Render messages
                const chatMessages = document.getElementById('chat-messages');
                chatMessages.innerHTML = '';

                if (data.messages && data.messages.length > 0) {
                    messages = data.messages;
                    console.log('[LOAD_CONV] Rendering', messages.length, 'messages');
                    messages.forEach((msg, idx) => {
                        console.log(`[LOAD_CONV] Message ${idx + 1} raw:`, msg);

                        // Parse Claude API content format: [{"type":"text","text":"..."}]
                        let content = msg.content;

                        // If it's a string, try to parse it as JSON
                        if (typeof content === 'string') {
                            try {
                                const parsed = JSON.parse(content);
                                if (Array.isArray(parsed)) {
                                    // Extract text from content blocks
                                    content = parsed
                                        .filter(block => block.type === 'text')
                                        .map(block => block.text)
                                        .join('\n');
                                }
                            } catch (e) {
                                // Not JSON, use as-is
                                console.log('[LOAD_CONV] Content is plain string');
                            }
                        } else if (Array.isArray(content)) {
                            // Already parsed array
                            content = content
                                .filter(block => block.type === 'text')
                                .map(block => block.text)
                                .join('\n');
                        }

                        console.log(`[LOAD_CONV] Adding message ${idx + 1}:`, msg.role, content.substring(0, 50));
                        addMessageToUI(msg.role, content);
                    });
                }

                console.log('[LOAD_CONV] Conversation loaded successfully');
            } catch (error) {
                console.error('[LOAD_CONV] Error loading conversation:', error);
                console.error('[LOAD_CONV] Error stack:', error.stack);
                renderWelcomeScreen();
            }
        }

        // Add thinking indicator to UI with animated dots
        function addThinkingIndicator() {
            const chatMessages = document.getElementById('chat-messages');

            // Remove any existing thinking indicators first (defensive)
            const existingIndicators = chatMessages.querySelectorAll('.thinking-indicator');
            existingIndicators.forEach(indicator => {
                console.log('[THINKING] Removing existing thinking indicator');
                indicator.remove();
            });

            console.log('[THINKING] Adding new thinking indicator');
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'thinking-indicator';
            thinkingDiv.innerHTML = `
                <div class="thinking-dots">
                    <div class="thinking-dot"></div>
                    <div class="thinking-dot"></div>
                    <div class="thinking-dot"></div>
                </div>
                <div class="thinking-text">${AGENTS[currentAgent].name} is thinking...</div>
            `;
            chatMessages.appendChild(thinkingDiv);
            console.log('[THINKING] Thinking indicator added to DOM');

            // Auto-scroll
            autoScroll();

            return thinkingDiv;

        // Add message to UI
        async function addMessageToUI(role, content, files = []) {
            const chatMessages = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            // Render markdown for assistant messages, plain text for user messages
            const renderedContent = role === 'assistant' && typeof marked !== 'undefined'
                ? marked.parse(content)
                : content.replace(/\n/g, '<br>');

            let fileHTML = '';
            if (files && files.length > 0 && role === 'user') {
                fileHTML = '<div style="margin-bottom: 0.75rem; display: flex; flex-wrap: wrap; gap: 0.5rem;">';
                for (const file of files) {
                    const isImage = file.type.startsWith('image/');
                    const fileIcon = isImage ? '🖼️' : (file.type === 'application/pdf' ? '📄' : '📝');
                    const fileName = file.name.length > 30 ? file.name.substring(0, 27) + '...' : file.name;

                    if (isImage) {
                        // Show image thumbnail
                        const reader = new FileReader();
                        const imagePromise = new Promise((resolve) => {
                            reader.onload = (e) => resolve(e.target.result);
                            reader.readAsDataURL(file);
                        });
                        const imageUrl = await imagePromise;
                        fileHTML += `
                            <div style="display: inline-block; padding: 0.5rem; background: rgba(255,255,255,0.1); border-radius: 8px; max-width: 200px;">
                                <img src="${imageUrl}" style="max-width: 100%; height: auto; border-radius: 4px; margin-bottom: 0.25rem;" />
                                <div style="font-size: 0.75rem; color: rgba(255,255,255,0.7); text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">${fileIcon} ${fileName}</div>
                            </div>
                        `;
                    } else {
                        // Show file chip with visible styling
                        fileHTML += `
                            <div style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; background: #e8e8e8; border: 1px solid #d0d0d0; border-radius: 8px; font-size: 0.875rem; color: #07334A;">
                                <span>${fileIcon}</span>
                                <span style="text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 200px; font-weight: 500;">${fileName}</span>
                            </div>
                        `;
                    }
                }
                fileHTML += '</div>';
            }

            messageDiv.innerHTML = `
                <div class="message-role">${role === 'user' ? 'You' : AGENTS[currentAgent].name}</div>
                <div class="message-content">${fileHTML}${renderedContent}</div>
            `;
            chatMessages.appendChild(messageDiv);

            // Add feedback buttons for assistant messages
            if (role === 'assistant' && inlineFeedback) {
                const messageIndex = chatMessages.querySelectorAll('.message.assistant').length - 1;
                messageDiv.setAttribute('data-message-index', messageIndex);
                inlineFeedback.addFeedbackButtons(messageDiv, messageIndex);
                inlineFeedback.incrementMessageCount();
            }

            // Auto-scroll
            autoScroll();

            return messageDiv;
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // Log version for debugging
        console.log('[VERSION] unified-agents.html v2026-02-25-v2 (with drag-drop + files-in-bubbles) loaded');
    </script>
</body>
</html>
