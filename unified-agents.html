<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title id="page-title">Team Oracle - Granted AI</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Shared Layout Styles -->
    <link rel="stylesheet" href="/public/css/shared-layout.css">

    <style>
        /* Agent-specific welcome screen */
        .welcome-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 4rem 2rem 12rem 2rem;
            text-align: center;
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            padding: 20px;
            background: linear-gradient(135deg, rgba(54, 202, 250, 0.1) 0%, rgba(38, 196, 182, 0.05) 100%);
            border: 1px solid rgba(54, 202, 250, 0.2);
            border-radius: 20px;
            color: var(--primary-cyan);
            box-shadow: 0 8px 24px rgba(54, 202, 250, 0.15),
                        0 0 0 1px rgba(54, 202, 250, 0.1) inset;
            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .welcome-icon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 2px 4px rgba(54, 202, 250, 0.3));
        }

        .welcome-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.75rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.1s backwards;
        }

        .welcome-subtitle {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            line-height: 1.6;
            font-weight: 500;
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.2s backwards;
        }

        .welcome-prompts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .welcome-prompt {
            padding: 1.25rem;
            background: linear-gradient(135deg, rgba(54, 202, 250, 0.03) 0%, rgba(38, 196, 182, 0.02) 100%);
            border: 1px solid var(--border);
            border-left: 3px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
            position: relative;
            overflow: hidden;
            animation: slideInFromBottom 0.5s cubic-bezier(0.4, 0, 0.2, 1) backwards;
        }

        @keyframes slideInFromBottom {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-prompt:nth-child(1) { animation-delay: 0.3s; }
        .welcome-prompt:nth-child(2) { animation-delay: 0.4s; }
        .welcome-prompt:nth-child(3) { animation-delay: 0.5s; }

        .welcome-prompt::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, var(--primary-cyan) 0%, var(--teal) 100%);
            transform: scaleY(0);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom;
        }

        .welcome-prompt:hover {
            background: linear-gradient(135deg, rgba(54, 202, 250, 0.08) 0%, rgba(38, 196, 182, 0.05) 100%);
            border-color: rgba(54, 202, 250, 0.3);
            border-left-color: var(--primary-cyan);
            transform: translateY(-4px) translateX(4px);
            box-shadow: 0 8px 24px rgba(54, 202, 250, 0.2),
                        0 0 0 1px rgba(54, 202, 250, 0.1) inset;
        }

        .welcome-prompt:hover::before {
            transform: scaleY(1);
            transform-origin: top;
        }

        .welcome-prompt:active {
            transform: translateY(-2px) translateX(2px) scale(0.98);
        }

        .welcome-prompt-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.9375rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .welcome-prompt-description {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.5;
            font-weight: 500;
        }

        /* Chat container */
        .chat-wrapper {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
            max-width: 900px;
            margin: 0 auto;
            padding: 0 2rem 10rem 2rem;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 0;
        }

        .chat-input-container {
            position: fixed;
            bottom: 0;
            left: 240px;
            right: 0;
            padding: 2rem;
            background: transparent;
            border-top: none;
            z-index: 100;
            pointer-events: none;
        }

        .chat-input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2),
                        0 0 0 1px rgba(54, 202, 250, 0.1) inset;
            backdrop-filter: blur(12px);
            pointer-events: auto;
        }

        .message {
            margin-bottom: 2.5rem;
            animation: messageSlideIn 0.3s ease-out;
            max-width: 100%;
        }

        @keyframes messageSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-role {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8125rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            color: var(--text-tertiary);
        }

        .message.user .message-role {
            color: var(--text-secondary);
        }

        .message.assistant .message-role {
            color: var(--primary-cyan);
        }

        .message-content {
            padding: 0;
            background: transparent;
            border: none;
            line-height: 1.7;
            font-size: 0.9375rem;
            color: var(--text-primary);
        }

        .message.user .message-content {
            opacity: 0.9;
        }

        .message.assistant .message-content {
            padding-left: 1rem;
            border-left: 2px solid rgba(54, 202, 250, 0.2);
        }

        /* Markdown formatting within messages */
        .message-content p {
            margin: 0 0 1.25rem 0;
            line-height: 1.7;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        .message-content strong {
            font-weight: 700;
            color: var(--text-primary);
        }

        .message-content em {
            font-style: italic;
            color: var(--text-secondary);
        }

        .message-content h1,
        .message-content h2,
        .message-content h3 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            margin: 1.5rem 0 1rem 0;
            color: var(--text-primary);
        }

        .message-content h1 {
            font-size: 1.5rem;
        }

        .message-content h2 {
            font-size: 1.25rem;
        }

        .message-content h3 {
            font-size: 1.0625rem;
        }

        .message-content ul,
        .message-content ol {
            margin: 1rem 0;
            padding-left: 1.5rem;
        }

        .message-content li {
            margin: 0.5rem 0;
            line-height: 1.6;
        }

        .message-content code {
            background: rgba(54, 202, 250, 0.08);
            color: var(--primary-cyan);
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-size: 0.875em;
            font-weight: 500;
        }

        .message-content pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 1.25rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1.5rem 0;
            border: 1px solid var(--border);
        }

        .message-content pre code {
            background: none;
            color: var(--light-cyan);
            padding: 0;
            font-size: 0.875rem;
        }

        .message-content a {
            color: var(--primary-cyan);
            text-decoration: none;
            border-bottom: 1px solid rgba(54, 202, 250, 0.3);
            transition: border-color 0.2s;
        }

        .message-content a:hover {
            border-bottom-color: var(--primary-cyan);
        }

        /* Thinking indicator - Premium animated design */
        .thinking-indicator {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            padding: 1.25rem 1.5rem;
            background: linear-gradient(135deg,
                rgba(15, 23, 42, 0.95) 0%,
                rgba(30, 41, 59, 0.9) 50%,
                rgba(15, 23, 42, 0.95) 100%);
            border: 1px solid rgba(54, 202, 250, 0.25);
            border-radius: 16px;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
            animation: messageSlideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(54, 202, 250, 0.1) inset,
                0 0 40px rgba(54, 202, 250, 0.05);
        }

        /* Animated gradient shimmer */
        .thinking-indicator::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(54, 202, 250, 0.15) 50%,
                transparent 100%);
            animation: shimmer 2.5s infinite;
        }

        @keyframes shimmer {
            to { left: 100%; }
        }

        /* Animated dots container */
        .thinking-dots {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .thinking-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-cyan) 0%, var(--secondary-teal) 100%);
            box-shadow: 0 0 12px rgba(54, 202, 250, 0.6);
            animation: dotPulse 1.4s ease-in-out infinite;
        }

        .thinking-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .thinking-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
                box-shadow: 0 0 8px rgba(54, 202, 250, 0.4);
            }
            50% {
                transform: scale(1.4);
                opacity: 1;
                box-shadow: 0 0 16px rgba(54, 202, 250, 0.8);
            }
        }

        .thinking-text {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            position: relative;
            z-index: 1;
            letter-spacing: 0.02em;
        }

        .input-form {
            display: flex;
            gap: 0.75rem;
        }

        .message-input {
            flex: 1;
            padding: 1rem 1.25rem;
            background: rgba(54, 202, 250, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text);
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            resize: none;
            min-height: 44px;
            max-height: 200px;
            overflow-y: hidden;
            overflow-x: hidden;
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .message-input:focus {
            outline: none;
            background: rgba(54, 202, 250, 0.05);
            border-color: var(--primary-cyan);
            box-shadow: 0 0 0 3px rgba(54, 202, 250, 0.1),
                        0 4px 12px rgba(54, 202, 250, 0.15);
            transform: translateY(-1px);
        }

        .send-button {
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, var(--primary-cyan) 0%, var(--teal) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(54, 202, 250, 0.3);
            position: relative;
            overflow: hidden;
        }

        .send-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--teal) 0%, var(--primary-cyan) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(54, 202, 250, 0.4);
        }

        .send-button:hover::before {
            opacity: 1;
        }

        .send-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(54, 202, 250, 0.3);
        }

        .send-button span {
            position: relative;
            z-index: 1;
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .send-button:disabled:hover {
            transform: none;
            box-shadow: none;
        }

        .send-button.hidden {
            display: none;
        }

        .stop-button {
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, var(--coral-red) 0%, #b83640 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(214, 69, 80, 0.3);
            display: none;
            align-items: center;
            gap: 0.5rem;
        }

        .stop-button.visible {
            display: flex;
        }

        .stop-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(214, 69, 80, 0.4);
        }

        .stop-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(214, 69, 80, 0.3);
        }

        .stop-button svg {
            width: 16px;
            height: 16px;
        }

        /* File upload styles */
        .file-upload-button {
            padding: 0.75rem;
            background: rgba(54, 202, 250, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            position: relative;
        }

        .file-upload-button:hover {
            background: rgba(54, 202, 250, 0.08);
            border-color: var(--primary-cyan);
            color: var(--primary-cyan);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(54, 202, 250, 0.2);
        }

        .file-upload-button:active {
            transform: translateY(0);
        }

        .file-upload-button svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        .file-upload-button:hover svg {
            transform: rotate(-12deg) scale(1.1);
        }

        .file-input-hidden {
            display: none;
        }

        .selected-files {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .file-chip {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: linear-gradient(135deg, rgba(54, 202, 250, 0.08) 0%, rgba(38, 196, 182, 0.05) 100%);
            border: 1px solid rgba(54, 202, 250, 0.2);
            border-radius: 8px;
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 600;
            animation: slideInFromTop 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(54, 202, 250, 0.1);
        }

        @keyframes slideInFromTop {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .file-chip-icon {
            width: 16px;
            height: 16px;
            color: var(--primary-cyan);
            filter: drop-shadow(0 1px 2px rgba(54, 202, 250, 0.3));
        }

        .file-chip-name {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-primary);
        }

        .file-chip-remove {
            cursor: pointer;
            color: var(--text-tertiary);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            padding: 0.125rem;
            border-radius: 4px;
        }

        .file-chip-remove:hover {
            color: var(--coral-red);
            background: rgba(214, 69, 80, 0.1);
            transform: scale(1.1);
        }

        .file-chip-remove svg {
            width: 14px;
            height: 14px;
        }

        .hidden {
            display: none;
        }

        /* Responsive adjustments for sidebar collapse */
        @media (max-width: 1024px) {
            .chat-input-container {
                left: 70px;
            }
        }

        @media (max-width: 768px) {
            .chat-input-container {
                left: 0;
                padding: 1rem;
            }

            .chat-input-wrapper {
                border-radius: 12px;
                padding: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- The shared-layout.js will inject sidebar and header here -->

    <!-- Welcome Screen (shown by default) -->
    <div id="welcome-screen" class="welcome-container">
        <!-- Will be populated by JS based on selected agent -->
    </div>

    <!-- Chat Interface (hidden until first message) -->
    <div id="chat-screen" class="chat-wrapper hidden">
        <div id="chat-messages" class="chat-messages"></div>
    </div>

    <!-- Chat Input (always visible) -->
    <div class="chat-input-container">
        <div class="chat-input-wrapper">
            <!-- Selected files display -->
            <div id="selected-files" class="selected-files"></div>

            <form id="message-form" class="input-form">
                <!-- Hidden file input -->
                <input
                    type="file"
                    id="file-input"
                    class="file-input-hidden"
                    multiple
                    accept=".pdf,.docx,.xlsx,.csv,.txt,.vtt,.png,.jpg,.jpeg,.webp"
                />

                <!-- File upload button -->
                <button type="button" id="file-upload-button" class="file-upload-button" title="Attach files">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M18.375 12.739l-7.693 7.693a4.5 4.5 0 01-6.364-6.364l10.94-10.94A3 3 0 1119.5 7.372L8.552 18.32m.009-.01l-.01.01m5.699-9.941l-7.81 7.81a1.5 1.5 0 002.112 2.13" />
                    </svg>
                </button>

                <textarea
                    id="message-input"
                    class="message-input"
                    placeholder="Type your message..."
                    autocomplete="off"
                    rows="1"
                ></textarea>
                <button type="submit" id="send-button" class="send-button">
                    <span>Send</span>
                </button>
                <button type="button" id="stop-button" class="stop-button" onclick="stopStreaming()">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <rect x="6" y="6" width="12" height="12" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Stop</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Shared Layout Script (injects sidebar/header) -->
    <script src="/public/js/shared-layout.js" defer></script>

    <!-- Markdown rendering library -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>

    <!-- Inline Feedback System -->
    <script src="/public/js/inline-feedback.js?v=20260302"></script>

    <script>
        // Configure marked for safe rendering
        if (typeof marked !== 'undefined') {
            marked.setOptions({
                breaks: true,  // Convert \n to <br>
                gfm: true,     // GitHub Flavored Markdown
                headerIds: false,
                mangle: false
            });
        }

        // Map URL-friendly agent names to backend agent types
        const AGENT_TYPE_MAP = {
            'oracle': 'internal-oracle',
            'grant-cards': 'grant-card-generator',
            'canexport-claims': 'canexport-claims',
            'etg-writer': 'etg-writer',
            'bcafe-writer': 'bcafe-writer',
            'buybc-writer': 'buybc-writer',
            'canexport-writer': 'canexport-writer',
            'readiness-strategist': 'readiness-strategist'
        };

        // Helper function to get backend agent type from URL name
        function getBackendAgentType(urlAgentName) {
            return AGENT_TYPE_MAP[urlAgentName] || urlAgentName;
        }

        // Agent Configuration (using URL-friendly names)
        const AGENTS = {
            oracle: {
                name: 'Team Oracle',
                subtitle: 'Your internal knowledge expert',
                icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />',
                prompts: [
                    { title: 'Company Info', description: 'Tell me about GetGranted', prompt: 'Tell me about GetGranted - what we do and how we help clients' },
                    { title: 'Grant Programs', description: 'What grants do we specialize in?', prompt: 'What grant programs does GetGranted specialize in?' },
                    { title: 'Internal Resources', description: 'Find internal documentation', prompt: 'Where can I find our internal process documentation?' }
                ]
            },
            'grant-cards': {

        // State

        // Initialize
        function init() {
            console.log('[INIT] Starting initialization...');
            console.log('[INIT] Full URL:', window.location.href);
            console.log('[INIT] Pathname:', window.location.pathname);

            // Parse URL: /{agent}/new or /{agent}/chat/{conversationId}
            const pathParts = window.location.pathname.split('/').filter(p => p);
            console.log('[INIT] Path parts:', pathParts);

            const agentFromPath = pathParts[0];
            const routeType = pathParts[1]; // 'new' or 'chat'
            const conversationIdFromPath = pathParts[2];

            console.log('[INIT] Parsed - Agent:', agentFromPath, 'RouteType:', routeType, 'ConvID:', conversationIdFromPath);

            // Set current agent
            if (AGENTS[agentFromPath]) {
                currentAgent = agentFromPath;
                console.log('[INIT] Set current agent to:', currentAgent);
            } else {
                console.warn('[INIT] Agent not found:', agentFromPath, 'Available:', Object.keys(AGENTS));
            }

            // If conversation ID in URL, load it
            if (routeType === 'chat' && conversationIdFromPath) {
                conversationId = conversationIdFromPath;
                console.log('[INIT] Loading conversation from URL:', conversationId);
                loadConversation(conversationId);
            } else {
                console.log('[INIT] Showing welcome screen');
                // Show welcome screen for new chat
                renderWelcomeScreen();
            }

            setupEventListeners();
            console.log('[INIT] Initialization complete');
        }

        // Render welcome screen for current agent
        function renderWelcomeScreen() {
            const agent = AGENTS[currentAgent];
            const welcomeScreen = document.getElementById('welcome-screen');

            welcomeScreen.innerHTML = `
                <div class="welcome-icon">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

                </div>

                    ${agent.prompts.map(p => `
                        <div class="welcome-prompt" onclick="sendPrompt('${p.prompt.replace(/'/g, "\\'")}')">
                            <div class="welcome-prompt-title">${p.title}</div>
                            <div class="welcome-prompt-description">${p.description}</div>
                        </div>
                    `).join('')}
                </div>
            `;

            // Update page title
            document.getElementById('page-title').textContent = `${agent.name} - Granted AI`;

        // Switch agent
        window.switchAgent = function(agentType) {
            if (!AGENTS[agentType]) return;

            currentAgent = agentType;
            conversationId = null;
            messages = [];

            // Show welcome, hide chat
            document.getElementById('welcome-screen').classList.remove('hidden');
            document.getElementById('chat-screen').classList.add('hidden');
            document.getElementById('chat-messages').innerHTML = '';
            document.getElementById('message-input').value = '';

            renderWelcomeScreen();

            // Update URL without reload - use /agent/new format
            window.history.pushState({}, '', `/${agentType}/new`);

            // Update active nav item
            if (window.updateActiveNav) {
                window.updateActiveNav();
            }
        };

        // Setup event listeners
        function setupEventListeners() {
            document.getElementById('message-form').addEventListener('submit', handleSubmit);

            // File upload button
            document.getElementById('file-upload-button').addEventListener('click', () => {
                document.getElementById('file-input').click();
            });

            // File input change
            document.getElementById('file-input').addEventListener('change', handleFileSelect);

            // Auto-resize textarea as user types
            const messageInput = document.getElementById('message-input');
            if (messageInput) {
                messageInput.addEventListener('input', function() {
                    // Reset height to recalculate
                    this.style.height = 'auto';
                    // Set to scrollHeight (content height), constrained by max-height in CSS
                    this.style.height = Math.min(this.scrollHeight, 200) + 'px';
                });

                // Handle Shift+Enter for new line, Enter alone to submit
                messageInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        document.getElementById('message-form').dispatchEvent(new Event('submit'));
                    }
                });
            }

            // Drag and drop file upload
            setupDragAndDrop();
        }

        // Setup drag and drop handlers
        function setupDragAndDrop() {
            // Create drag overlay if it doesn't exist
            let dragOverlay = document.getElementById('drag-drop-overlay');
            if (!dragOverlay) {
                dragOverlay = document.createElement('div');
                dragOverlay.id = 'drag-drop-overlay';
                dragOverlay.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(7, 51, 74, 0.95);
                    backdrop-filter: blur(8px);
                    z-index: 10000;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    opacity: 0;
                    pointer-events: none;
                    transition: opacity 0.2s ease;
                `;
                dragOverlay.innerHTML = `
                    <div style="text-align: center; padding: 3rem; border: 3px dashed #36CAFA; border-radius: 24px; background: rgba(54, 202, 250, 0.05); max-width: 500px;">
                        <div style="font-size: 4rem; margin-bottom: 1rem;">📎</div>
                        <div style="font-size: 1.5rem; font-weight: 600; color: #36CAFA; margin-bottom: 0.5rem;">Drop files here to upload</div>
                        <div style="font-size: 0.95rem; color: rgba(255, 255, 255, 0.7);">PDF, DOCX, TXT, images, and spreadsheets supported</div>
                    </div>
                `;
                document.body.appendChild(dragOverlay);
            }

            let dragCounter = 0;

            // Prevent default drag behavior
            document.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
            });

            document.addEventListener('dragenter', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dragCounter++;
                if (e.dataTransfer.types.includes('Files')) {
                    dragOverlay.style.opacity = '1';
                    dragOverlay.style.pointerEvents = 'all';
                }
            });

            document.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dragCounter--;
                if (dragCounter === 0) {
                    dragOverlay.style.opacity = '0';
                    dragOverlay.style.pointerEvents = 'none';
                }
            });

            document.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dragCounter = 0;
                dragOverlay.style.opacity = '0';
                dragOverlay.style.pointerEvents = 'none';

                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    const files = Array.from(e.dataTransfer.files);
                    selectedFiles = [...selectedFiles, ...files];
                    renderSelectedFiles();
                }
            });
        }

        // Handle file selection
        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            selectedFiles = [...selectedFiles, ...files];
            renderSelectedFiles();

            // Clear the file input so the same file can be selected again
            e.target.value = '';
        }

        // Remove a selected file
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderSelectedFiles();
        }

        // Render selected files UI
        function renderSelectedFiles() {
            const container = document.getElementById('selected-files');

            if (selectedFiles.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = selectedFiles.map((file, index) => {
                // Determine file icon based on type
                let icon = '<path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />';

                if (file.type.startsWith('image/')) {
                    icon = '<path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />';
                } else if (file.type === 'application/pdf') {
                    icon = '<path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />';
                }

                return `
                    <div class="file-chip">
                        <svg class="file-chip-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            ${icon}
                        </svg>
                        <span class="file-chip-name" title="${file.name}">${file.name}</span>
                        <span class="file-chip-remove" onclick="removeFile(${index})">
                            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </span>
                    </div>
                `;
            }).join('');
        }

        // Expose removeFile globally for onclick
        window.removeFile = removeFile;

        // Stop streaming function
        window.stopStreaming = function() {
            if (currentAbortController) {
                console.log('[DEBUG] Stopping stream...');
                currentAbortController.abort();
                currentAbortController = null;

                // Hide stop button, show send button
                const stopButton = document.getElementById('stop-button');
                const sendButton = document.getElementById('send-button');
                stopButton.classList.remove('visible');
                sendButton.classList.remove('hidden');
            }
        };

        // Handle form submission
        async function handleSubmit(e) {
            e.preventDefault();

            const input = document.getElementById('message-input');
            const message = input.value.trim();

            // Allow sending if there's a message or files
            if (!message && selectedFiles.length === 0) return;

            // Store files before clearing
            const filesToSend = [...selectedFiles];

            // Clear input and files immediately
            input.value = '';
            input.style.height = 'auto'; // Reset textarea height
            selectedFiles = [];
            renderSelectedFiles();

            // Send message with files
            await sendMessage(message, filesToSend);
        }

        // Send a suggested prompt
        window.sendPrompt = async function(prompt) {
            await sendMessage(prompt, []);
        };

        // Convert file to base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Send message to API
        async function sendMessage(message, files = []) {
            // Show chat screen (keep welcome visible - it will scroll up)
            const welcomeScreen = document.getElementById('welcome-screen');
            const chatScreen = document.getElementById('chat-screen');

            // On first message, hide welcome and show chat
            if (chatScreen.classList.contains('hidden')) {
                welcomeScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');
            }

            // Add user message to UI with files
            await addMessageToUI('user', message, files);

            // Show thinking indicator
            console.log('[SEND_MSG] About to add thinking indicator');
            const thinkingIndicator = addThinkingIndicator();
            console.log('[SEND_MSG] Thinking indicator reference:', thinkingIndicator);

            // Create abort controller for this request
            currentAbortController = new AbortController();

            // Show stop button, hide send button
            const stopButton = document.getElementById('stop-button');
            const sendButton = document.getElementById('send-button');
            const messageInput = document.getElementById('message-input');

            stopButton.classList.add('visible');
            sendButton.classList.add('hidden');
            messageInput.disabled = true;

            try {
                // Create conversation ID if needed (must be UUID for Postgres)
                const isFirstMessage = !conversationId;
                if (!conversationId) {
                    // Generate a proper UUID v4
                    conversationId = crypto.randomUUID();

                    // Initialize inline feedback system for this conversation
                    if (window.InlineFeedback && !inlineFeedback) {
                        inlineFeedback = new InlineFeedback(conversationId);
                        console.log('[FEEDBACK] Inline feedback initialized for conversation:', conversationId);
                    }

                    // Update URL to /agent/chat/{conversationId} on first message
                    window.history.pushState({}, '', `/${currentAgent}/chat/${conversationId}`);
                }

                // Process file attachments
                const attachments = [];
                if (files && files.length > 0) {
                    console.log(`[DEBUG] Processing ${files.length} file(s)...`);

                    for (const file of files) {
                        try {
                            const base64Data = await fileToBase64(file);
                            const attachment = {
                                filename: file.name,
                                data: base64Data
                            };

                            // Determine attachment type
                            if (file.type.startsWith('image/')) {
                                attachment.type = 'image';
                                attachment.mimeType = file.type;
                            } else if (file.type === 'application/pdf') {
                                attachment.type = 'pdf';
                                attachment.mimeType = 'application/pdf';
                            } else {
                                attachment.type = 'document';
                                attachment.mimeType = file.type || 'text/plain';
                            }

                            attachments.push(attachment);
                            console.log(`[DEBUG] Processed file: ${file.name} (${file.type})`);
                        } catch (error) {
                            console.error(`[DEBUG] Failed to process file ${file.name}:`, error);
                        }
                    }
                }

                console.log('[DEBUG] Sending message:', {
                    message: message.substring(0, 50),
                    conversationId,
                    currentAgent,
                    backendAgent: getBackendAgentType(currentAgent),
                    attachments: attachments.length
                });

                // Call API
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    credentials: 'include', // Send cookies with request
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message || 'Analyze the attached document(s).',
                        conversationId,
                        agentType: getBackendAgentType(currentAgent),
                        attachments
                    }),
                    signal: currentAbortController.signal
                });

                console.log('[DEBUG] Response received:', response.status, response.ok);

                if (!response.ok) {
                    throw new Error('Failed to send message');
                }

                // Read streaming response
                console.log('[DEBUG] Starting to read stream...');
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let assistantMessage = '';
                let messageElement = null;
                let chunkCount = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    chunkCount++;
                    console.log(`[DEBUG] Chunk ${chunkCount}: done=${done}, bytes=${value?.length || 0}`);

                    if (done) {
                        console.log('[DEBUG] Stream ended, total message length:', assistantMessage.length);
                        break;
                    }

                    const chunk = decoder.decode(value);
                    console.log(`[DEBUG] Chunk text:`, chunk.substring(0, 100));
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') {
                                console.log('[DEBUG] Received [DONE] signal');
                                continue;
                            }

                            try {
                                const parsed = JSON.parse(data);
                                console.log('[DEBUG] Parsed SSE event:', parsed.type);

                                // Handle text delta events (actual response content)
                                if (parsed.type === 'text_delta' && parsed.text) {
                                    console.log('[SSE] ✅ text_delta received:', parsed.text.substring(0, 50));
                                    assistantMessage += parsed.text;
                                    console.log('[SSE] 📊 Total message length:', assistantMessage.length);

                                    // Create or update message element
                                    if (!messageElement) {
                                        console.log('[SSE] 🆕 Creating assistant message element');
                                        // Remove thinking indicator when first response arrives
                                        if (thinkingIndicator && thinkingIndicator.parentNode) {
                                            console.log('[SSE] 🗑️  Removing thinking indicator');
                                            thinkingIndicator.remove();
                                        }
                                        messageElement = await addMessageToUI('assistant', '');
                                        console.log('[SSE] ✅ Message element created:', messageElement);
                                    }

                                    // Render markdown in real-time
                                    const contentElement = messageElement.querySelector('.message-content');
                                    console.log('[SSE] 📝 Rendering to content element:', contentElement);
                                    if (typeof marked !== 'undefined') {
                                        contentElement.innerHTML = marked.parse(assistantMessage);
                                        console.log('[SSE] ✅ Markdown rendered, HTML length:', contentElement.innerHTML.length);
                                    } else {
                                        contentElement.textContent = assistantMessage;
                                        console.log('[SSE] ✅ Text rendered (no markdown)');
                                    }

                                    // Auto-scroll
                                    const chatMessages = document.getElementById('chat-messages');
                                    chatMessages.scrollTop = chatMessages.scrollHeight;
                                }
                            } catch (e) {
                                console.error('[DEBUG] Parse error:', e, 'for line:', line);
                            }
                        }
                    }
                }

                // If no message element was created, show the collected message (defensive programming)
                if (!messageElement && assistantMessage) {
                    console.log('[DEBUG] Creating message element after stream ended');
                    if (thinkingIndicator && thinkingIndicator.parentNode) {
                        thinkingIndicator.remove();
                    }
                    addMessageToUI('assistant', assistantMessage);
                } else if (!messageElement && !assistantMessage) {
                    console.error('[DEBUG] No assistant message received!');
                    if (thinkingIndicator && thinkingIndicator.parentNode) {
                        thinkingIndicator.remove();
                    }
                    addMessageToUI('assistant', 'No response received from the assistant.');
                }
            } catch (error) {
                // Handle abort separately from other errors
                if (error.name === 'AbortError') {
                    console.log('[DEBUG] Request was aborted by user');
                    // Remove thinking indicator on abort
                    if (thinkingIndicator && thinkingIndicator.parentNode) {
                        thinkingIndicator.remove();
                    }
                    // Optionally show a message that streaming was stopped
                    // addMessageToUI('assistant', '[Response stopped by user]');
                } else {
                    console.error('Error sending message:', error);
                    // Remove thinking indicator on error
                    if (thinkingIndicator && thinkingIndicator.parentNode) {
                        thinkingIndicator.remove();
                    }
                    addMessageToUI('assistant', 'Sorry, there was an error processing your message.');
                }
            } finally {
                // Clean up: hide stop button, show send button
                stopButton.classList.remove('visible');
                sendButton.classList.remove('hidden');
                messageInput.disabled = false;
                messageInput.focus();
                currentAbortController = null;
            }
        }

        // Load existing conversation from server
        async function loadConversation(convId) {
            console.log('[LOAD_CONV] Starting to load conversation:', convId);

            // Initialize inline feedback system for loaded conversation
            if (window.InlineFeedback && !inlineFeedback) {
                inlineFeedback = new InlineFeedback(convId);
                console.log('[FEEDBACK] Inline feedback initialized for loaded conversation:', convId);
            }

            try {
                const url = `/api/conversations/${convId}`;
                console.log('[LOAD_CONV] Fetching from:', url);

                const response = await fetch(url, {
                    credentials: 'include'
                });

                console.log('[LOAD_CONV] Response status:', response.status, response.statusText);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('[LOAD_CONV] Failed to load conversation. Status:', response.status);
                    console.error('[LOAD_CONV] Error response:', errorText);
                    renderWelcomeScreen();
                    return;
                }

                const data = await response.json();
                console.log('[LOAD_CONV] Received data:', data);
                console.log('[LOAD_CONV] Messages count:', data.messages?.length || 0);

                // Hide welcome, show chat
                const welcomeScreen = document.getElementById('welcome-screen');
                const chatScreen = document.getElementById('chat-screen');

                console.log('[LOAD_CONV] Welcome screen element:', welcomeScreen);
                console.log('[LOAD_CONV] Chat screen element:', chatScreen);

                welcomeScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');

                console.log('[LOAD_CONV] Toggled screen visibility');

                // Render messages
                const chatMessages = document.getElementById('chat-messages');
                chatMessages.innerHTML = '';

                if (data.messages && data.messages.length > 0) {
                    messages = data.messages;
                    console.log('[LOAD_CONV] Rendering', messages.length, 'messages');
                    messages.forEach((msg, idx) => {
                        console.log(`[LOAD_CONV] Message ${idx + 1} raw:`, msg);

                        // Parse Claude API content format: [{"type":"text","text":"..."}]
                        let content = msg.content;

                        // If it's a string, try to parse it as JSON
                        if (typeof content === 'string') {
                            try {
                                const parsed = JSON.parse(content);
                                if (Array.isArray(parsed)) {
                                    // Extract text from content blocks
                                    content = parsed
                                        .filter(block => block.type === 'text')
                                        .map(block => block.text)
                                        .join('\n');
                                }
                            } catch (e) {
                                // Not JSON, use as-is
                                console.log('[LOAD_CONV] Content is plain string');
                            }
                        } else if (Array.isArray(content)) {
                            // Already parsed array
                            content = content
                                .filter(block => block.type === 'text')
                                .map(block => block.text)
                                .join('\n');
                        }

                        console.log(`[LOAD_CONV] Adding message ${idx + 1}:`, msg.role, content.substring(0, 50));
                        addMessageToUI(msg.role, content);
                    });
                }

                console.log('[LOAD_CONV] Conversation loaded successfully');
            } catch (error) {
                console.error('[LOAD_CONV] Error loading conversation:', error);
                console.error('[LOAD_CONV] Error stack:', error.stack);
                renderWelcomeScreen();
            }
        }

        // Add thinking indicator to UI with animated dots
        function addThinkingIndicator() {
            const chatMessages = document.getElementById('chat-messages');

            // Remove any existing thinking indicators first (defensive)
            const existingIndicators = chatMessages.querySelectorAll('.thinking-indicator');
            existingIndicators.forEach(indicator => {
                console.log('[THINKING] Removing existing thinking indicator');
                indicator.remove();
            });

            console.log('[THINKING] Adding new thinking indicator');
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'thinking-indicator';
            thinkingDiv.innerHTML = `
                <div class="thinking-dots">
                    <div class="thinking-dot"></div>
                    <div class="thinking-dot"></div>
                    <div class="thinking-dot"></div>
                </div>
                <div class="thinking-text">${AGENTS[currentAgent].name} is thinking...</div>
            `;
            chatMessages.appendChild(thinkingDiv);
            console.log('[THINKING] Thinking indicator added to DOM');

            // Auto-scroll
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return thinkingDiv;
        }

        // Add message to UI
        async function addMessageToUI(role, content, files = []) {
            const chatMessages = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            // Render markdown for assistant messages, plain text for user messages
            const renderedContent = role === 'assistant' && typeof marked !== 'undefined'
                ? marked.parse(content)
                : content.replace(/\n/g, '<br>');

            let fileHTML = '';
            if (files && files.length > 0 && role === 'user') {
                fileHTML = '<div style="margin-bottom: 0.75rem; display: flex; flex-wrap: wrap; gap: 0.5rem;">';
                for (const file of files) {
                    const isImage = file.type.startsWith('image/');
                    const fileIcon = isImage ? '🖼️' : (file.type === 'application/pdf' ? '📄' : '📝');
                    const fileName = file.name.length > 30 ? file.name.substring(0, 27) + '...' : file.name;

                    if (isImage) {
                        // Show image thumbnail
                        const reader = new FileReader();
                        const imagePromise = new Promise((resolve) => {
                            reader.onload = (e) => resolve(e.target.result);
                            reader.readAsDataURL(file);
                        });
                        const imageUrl = await imagePromise;
                        fileHTML += `
                            <div style="display: inline-block; padding: 0.5rem; background: rgba(255,255,255,0.1); border-radius: 8px; max-width: 200px;">
                                <img src="${imageUrl}" style="max-width: 100%; height: auto; border-radius: 4px; margin-bottom: 0.25rem;" />
                                <div style="font-size: 0.75rem; color: rgba(255,255,255,0.7); text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">${fileIcon} ${fileName}</div>
                            </div>
                        `;
                    } else {
                        // Show file chip with visible styling
                        fileHTML += `
                            <div style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; background: #e8e8e8; border: 1px solid #d0d0d0; border-radius: 8px; font-size: 0.875rem; color: #07334A;">
                                <span>${fileIcon}</span>
                                <span style="text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 200px; font-weight: 500;">${fileName}</span>
                            </div>
                        `;
                    }
                }
                fileHTML += '</div>';
            }

            messageDiv.innerHTML = `
                <div class="message-role">${role === 'user' ? 'You' : AGENTS[currentAgent].name}</div>
                <div class="message-content">${fileHTML}${renderedContent}</div>
            `;
            chatMessages.appendChild(messageDiv);

            // Add feedback buttons for assistant messages
            if (role === 'assistant' && inlineFeedback) {
                const messageIndex = chatMessages.querySelectorAll('.message.assistant').length - 1;
                messageDiv.setAttribute('data-message-index', messageIndex);
                inlineFeedback.addFeedbackButtons(messageDiv, messageIndex);
                inlineFeedback.incrementMessageCount();
            }

            // Auto-scroll
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return messageDiv;
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // Log version for debugging
        console.log('[VERSION] unified-agents.html v2026-02-25-v2 (with drag-drop + files-in-bubbles) loaded');
    </script>
