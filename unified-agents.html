<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Team Oracle - Granted AI Hub</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Shared Layout Styles -->
    <link rel="stylesheet" href="/public/css/shared-layout.css">

    <style>
        /* Agent-specific welcome screen */
        .welcome-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 4rem 2rem;
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            padding: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--primary-teal);
        }

        .welcome-icon svg {
            width: 100%;
            height: 100%;
        }

        .welcome-title {
            font-family: 'Syne', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text);
        }

        .welcome-subtitle {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            line-height: 1.6;
        }

        .welcome-prompts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .welcome-prompt {
            padding: 1.25rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .welcome-prompt:hover {
            border-color: var(--primary-teal);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(94, 234, 212, 0.1);
        }

        .welcome-prompt-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .welcome-prompt-description {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Chat container */
        .chat-wrapper {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
            max-width: 900px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 0;
        }

        .chat-input-container {
            padding: 1.5rem 0;
            background: var(--bg);
            border-top: 1px solid var(--border);
        }

        .message {
            margin-bottom: 1.5rem;
            animation: messageSlideIn 0.3s ease-out;
        }

        @keyframes messageSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-role {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        .message-content {
            padding: 1rem 1.25rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            line-height: 1.6;
        }

        .message.assistant .message-content {
            border-left: 3px solid var(--primary-teal);
        }

        .input-form {
            display: flex;
            gap: 0.75rem;
        }

        .message-input {
            flex: 1;
            padding: 1rem 1.25rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text);
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--primary-teal);
            box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.1);
        }

        .send-button {
            padding: 1rem 1.5rem;
            background: var(--primary-teal);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .send-button:hover {
            background: var(--teal-dark);
            transform: translateY(-1px);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- The shared-layout.js will inject sidebar and header here -->

    <div class="page-content">
        <!-- Welcome Screen (shown by default) -->
        <div id="welcome-screen" class="welcome-container">
            <!-- Will be populated by JS based on selected agent -->
        </div>

        <!-- Chat Interface (hidden until first message) -->
        <div id="chat-screen" class="chat-wrapper hidden">
            <div id="chat-messages" class="chat-messages"></div>

            <div class="chat-input-container">
                <form id="message-form" class="input-form">
                    <input
                        type="text"
                        id="message-input"
                        class="message-input"
                        placeholder="Type your message..."
                        autocomplete="off"
                    />
                    <button type="submit" id="send-button" class="send-button">Send</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Shared Layout Script (injects sidebar/header) -->
    <script src="/public/js/shared-layout.js" defer></script>

    <script>
        // Agent Configuration
        const AGENTS = {
            oracle: {
                name: 'Team Oracle',
                subtitle: 'Your internal knowledge expert for Granted Consulting',
                icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />',
                prompts: [
                    { title: 'Company Info', description: 'Tell me about Granted Consulting', prompt: 'Tell me about Granted Consulting - what we do and how we help clients' },
                    { title: 'Grant Programs', description: 'What grants do we specialize in?', prompt: 'What grant programs does Granted Consulting specialize in?' },
                    { title: 'Internal Resources', description: 'Find internal documentation', prompt: 'Where can I find our internal process documentation?' }
                ]
            },
            'grant-cards': {
                name: 'Grant Cards',
                subtitle: 'Extract grant criteria and create structured grant cards',
                icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />',
                prompts: [
                    { title: 'Extract Criteria', description: 'Upload and analyze a grant document', prompt: 'I have a grant document to analyze. Can you extract the eligibility criteria?' },
                    { title: 'Create Card', description: 'Generate a new grant card', prompt: 'Create a new grant card for this program' },
                    { title: 'Review Card', description: 'Review an existing grant card', prompt: 'Review this grant card for accuracy and completeness' }
                ]
            },
            'canexport-claims': {
                name: 'Claims Auditor',
                subtitle: 'CanExport SME claims verification and compliance',
                icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z" />',
                prompts: [
                    { title: 'Audit Claim', description: 'Review expense eligibility', prompt: 'Audit this CanExport claim for eligibility and compliance' },
                    { title: 'Categorize Expenses', description: 'Check expense categories', prompt: 'Help me categorize these expenses according to CanExport rules' },
                    { title: 'Calculate Reimbursement', description: 'Determine reimbursable amount', prompt: 'Calculate the eligible reimbursement for this claim' }
                ]
            },
            'etg-writer': {
                name: 'ETG Business Case',
                subtitle: 'BC Employer Training Grant application specialist',
                icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />',
                prompts: [
                    { title: 'Start Application', description: 'Begin ETG business case', prompt: 'Help me start a new ETG business case for employee training' },
                    { title: 'Training Plan', description: 'Develop training strategy', prompt: 'Develop a training plan that aligns with ETG requirements' },
                    { title: 'Review Draft', description: 'Review business case', prompt: 'Review my ETG business case draft for competitiveness' }
                ]
            },
            'bcafe-writer': {
                name: 'BCAFE Applications',
                subtitle: 'BC Agriculture and Food Export Program specialist',
                icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418" />',
                prompts: [
                    { title: 'Eligibility Check', description: 'Verify BCAFE eligibility', prompt: 'Check if my agricultural export project is eligible for BCAFE' },
                    { title: 'Market Strategy', description: 'Develop export strategy', prompt: 'Help me develop a market entry strategy for BCAFE' },
                    { title: 'Draft Application', description: 'Create BCAFE application', prompt: 'Draft a BCAFE application for my export project' }
                ]
            },
            'buybc-writer': {
                name: 'Buy BC Partnership',
                subtitle: 'Buy BC Partnership Program application specialist',
                icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />',
                prompts: [
                    { title: 'Program Overview', description: 'Learn about Buy BC', prompt: 'Tell me about the Buy BC Partnership Program' },
                    { title: 'Eligibility', description: 'Check eligibility criteria', prompt: 'Am I eligible for Buy BC Partnership funding?' },
                    { title: 'Application Help', description: 'Draft application', prompt: 'Help me draft a Buy BC Partnership application' }
                ]
            },
            'canexport-writer': {
                name: 'CanExport Applications',
                subtitle: 'CanExport SME application specialist',
                icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M20.893 13.393l-1.135-1.135a2.252 2.252 0 01-.421-.585l-1.08-2.16a.414.414 0 00-.663-.107.827.827 0 01-.812.21l-1.273-.363a.89.89 0 00-.738 1.595l.587.39c.59.395.674 1.23.172 1.732l-.2.2c-.212.212-.33.498-.33.796v.41c0 .409-.11.809-.32 1.158l-1.315 2.191a2.11 2.11 0 01-1.81 1.025 1.055 1.055 0 01-1.055-1.055v-1.172c0-.92-.56-1.747-1.414-2.089l-.655-.261a2.25 2.25 0 01-1.383-2.46l.007-.042a2.25 2.25 0 01.29-.787l.09-.15a2.25 2.25 0 012.37-1.048l1.178.236a1.125 1.125 0 001.302-.795l.208-.73a1.125 1.125 0 00-.578-1.315l-.665-.332-.091.091a2.25 2.25 0 01-1.591.659h-.18c-.249 0-.487.1-.662.274a.931.931 0 01-1.458-1.137l1.411-2.353a2.25 2.25 0 00.286-.76m11.928 9.869A9 9 0 008.965 3.525m11.928 9.868A9 9 0 118.965 3.525" />',
                prompts: [
                    { title: 'Start Application', description: 'Begin CanExport application', prompt: 'Help me start a CanExport SME application' },
                    { title: 'Market Plan', description: 'Develop export strategy', prompt: 'Develop an export market development plan for CanExport' },
                    { title: 'Budget Planning', description: 'Create eligible budget', prompt: 'Help me create a CanExport-eligible project budget' }
                ]
            },
            'readiness-strategist': {
                name: 'Grant Readiness',
                subtitle: 'Readiness assessment and strategic planning',
                icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />',
                prompts: [
                    { title: 'Readiness Assessment', description: 'Evaluate grant readiness', prompt: 'Assess our readiness for grant applications' },
                    { title: 'Strategy Development', description: 'Create funding strategy', prompt: 'Develop a strategic funding plan for our organization' },
                    { title: 'Gap Analysis', description: 'Identify improvement areas', prompt: 'Identify gaps in our grant application readiness' }
                ]
            }
        };

        // State
        let currentAgent = 'oracle';
        let conversationId = null;
        let messages = [];

        // Initialize
        function init() {
            // Get agent from URL or default to oracle
            const pathParts = window.location.pathname.split('/');
            const agentFromPath = pathParts[1];

            if (AGENTS[agentFromPath]) {
                currentAgent = agentFromPath;
            }

            renderWelcomeScreen();
            setupEventListeners();
        }

        // Render welcome screen for current agent
        function renderWelcomeScreen() {
            const agent = AGENTS[currentAgent];
            const welcomeScreen = document.getElementById('welcome-screen');

            welcomeScreen.innerHTML = `
                <div class="welcome-icon">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        ${agent.icon}
                    </svg>
                </div>
                <h1 class="welcome-title">${agent.name}</h1>
                <p class="welcome-subtitle">${agent.subtitle}</p>
                <div class="welcome-prompts">
                    ${agent.prompts.map(p => `
                        <div class="welcome-prompt" onclick="sendPrompt('${p.prompt.replace(/'/g, "\\'")}')">
                            <div class="welcome-prompt-title">${p.title}</div>
                            <div class="welcome-prompt-description">${p.description}</div>
                        </div>
                    `).join('')}
                </div>
            `;

            // Update page title
            document.getElementById('page-title').textContent = `${agent.name} - Granted AI Hub`;
        }

        // Switch agent
        window.switchAgent = function(agentType) {
            if (!AGENTS[agentType]) return;

            currentAgent = agentType;
            conversationId = null;
            messages = [];

            // Show welcome, hide chat
            document.getElementById('welcome-screen').classList.remove('hidden');
            document.getElementById('chat-screen').classList.add('hidden');
            document.getElementById('chat-messages').innerHTML = '';
            document.getElementById('message-input').value = '';

            renderWelcomeScreen();

            // Update URL without reload
            window.history.pushState({}, '', `/${agentType}`);

            // Update active nav item
            if (window.updateActiveNav) {
                window.updateActiveNav();
            }
        };

        // Setup event listeners
        function setupEventListeners() {
            document.getElementById('message-form').addEventListener('submit', handleSubmit);
        }

        // Handle form submission
        async function handleSubmit(e) {
            e.preventDefault();

            const input = document.getElementById('message-input');
            const message = input.value.trim();

            if (!message) return;

            // Clear input
            input.value = '';

            // Send message
            await sendMessage(message);
        }

        // Send a suggested prompt
        window.sendPrompt = async function(prompt) {
            await sendMessage(prompt);
        };

        // Send message to API
        async function sendMessage(message) {
            // Show chat screen, hide welcome
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');

            // Add user message to UI
            addMessageToUI('user', message);

            // Disable input
            const sendButton = document.getElementById('send-button');
            const messageInput = document.getElementById('message-input');
            sendButton.disabled = true;
            messageInput.disabled = true;

            try {
                // Create conversation ID if needed
                if (!conversationId) {
                    conversationId = `${currentAgent}-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
                }

                // Call API
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message,
                        conversationId,
                        agentType: currentAgent
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to send message');
                }

                // Read streaming response
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let assistantMessage = '';
                let messageElement = null;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;

                            try {
                                const parsed = JSON.parse(data);
                                if (parsed.type === 'content_block_delta' && parsed.delta?.text) {
                                    assistantMessage += parsed.delta.text;

                                    // Create or update message element
                                    if (!messageElement) {
                                        messageElement = addMessageToUI('assistant', '');
                                    }
                                    messageElement.querySelector('.message-content').textContent = assistantMessage;

                                    // Auto-scroll
                                    const chatMessages = document.getElementById('chat-messages');
                                    chatMessages.scrollTop = chatMessages.scrollHeight;
                                }
                            } catch (e) {
                                // Ignore parse errors
                            }
                        }
                    }
                }
            } catch (error) {
                console.error('Error sending message:', error);
                addMessageToUI('assistant', 'Sorry, there was an error processing your message.');
            } finally {
                // Re-enable input
                sendButton.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        }

        // Add message to UI
        function addMessageToUI(role, content) {
            const chatMessages = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `
                <div class="message-role">${role === 'user' ? 'You' : AGENTS[currentAgent].name}</div>
                <div class="message-content">${content}</div>
            `;
            chatMessages.appendChild(messageDiv);

            // Auto-scroll
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return messageDiv;
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
