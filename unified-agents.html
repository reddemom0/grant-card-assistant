<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Team Oracle - GetGranted AI</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Shared Layout Styles -->
    <link rel="stylesheet" href="/public/css/shared-layout.css">

    <style>
        /* Agent-specific welcome screen */
        .welcome-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 4rem 2rem 8rem 2rem;
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            padding: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--primary-cyan);
        }

        .welcome-icon svg {
            width: 100%;
            height: 100%;
        }

        .welcome-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .welcome-subtitle {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            line-height: 1.6;
        }

        .welcome-prompts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .welcome-prompt {
            padding: 1.25rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .welcome-prompt:hover {
            border-color: var(--primary-cyan);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(54, 202, 250, 0.15);
        }

        .welcome-prompt-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .welcome-prompt-description {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Chat container */
        .chat-wrapper {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
            max-width: 900px;
            margin: 0 auto;
            padding: 0 2rem 6rem 2rem;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 0;
        }

        .chat-input-container {
            position: fixed;
            bottom: 0;
            left: 240px;
            right: 0;
            padding: 1.5rem 2rem;
            background: var(--bg);
            border-top: 1px solid var(--border);
            z-index: 100;
        }

        .chat-input-wrapper {
            max-width: 900px;
            margin: 0 auto;
        }

        .message {
            margin-bottom: 2.5rem;
            animation: messageSlideIn 0.3s ease-out;
            max-width: 100%;
        }

        @keyframes messageSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-role {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8125rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            color: var(--text-tertiary);
        }

        .message.user .message-role {
            color: var(--text-secondary);
        }

        .message.assistant .message-role {
            color: var(--primary-cyan);
        }

        .message-content {
            padding: 0;
            background: transparent;
            border: none;
            line-height: 1.7;
            font-size: 0.9375rem;
            color: var(--text-primary);
        }

        .message.user .message-content {
            opacity: 0.9;
        }

        .message.assistant .message-content {
            padding-left: 1rem;
            border-left: 2px solid rgba(54, 202, 250, 0.2);
        }

        /* Markdown formatting within messages */
        .message-content p {
            margin: 0 0 1.25rem 0;
            line-height: 1.7;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        .message-content strong {
            font-weight: 700;
            color: var(--text-primary);
        }

        .message-content em {
            font-style: italic;
            color: var(--text-secondary);
        }

        .message-content h1,
        .message-content h2,
        .message-content h3 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            margin: 1.5rem 0 1rem 0;
            color: var(--text-primary);
        }

        .message-content h1 {
            font-size: 1.5rem;
        }

        .message-content h2 {
            font-size: 1.25rem;
        }

        .message-content h3 {
            font-size: 1.0625rem;
        }

        .message-content ul,
        .message-content ol {
            margin: 1rem 0;
            padding-left: 1.5rem;
        }

        .message-content li {
            margin: 0.5rem 0;
            line-height: 1.6;
        }

        .message-content code {
            background: rgba(54, 202, 250, 0.08);
            color: var(--primary-cyan);
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-size: 0.875em;
            font-weight: 500;
        }

        .message-content pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 1.25rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1.5rem 0;
            border: 1px solid var(--border);
        }

        .message-content pre code {
            background: none;
            color: var(--light-cyan);
            padding: 0;
            font-size: 0.875rem;
        }

        .message-content a {
            color: var(--primary-cyan);
            text-decoration: none;
            border-bottom: 1px solid rgba(54, 202, 250, 0.3);
            transition: border-color 0.2s;
        }

        .message-content a:hover {
            border-bottom-color: var(--primary-cyan);
        }

        /* Thinking indicator */
        .thinking-indicator {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.25rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--primary-cyan);
            border-radius: 12px;
            margin-bottom: 1.5rem;
            animation: messageSlideIn 0.3s ease-out;
        }

        .thinking-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--primary-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .thinking-text {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .input-form {
            display: flex;
            gap: 0.75rem;
        }

        .message-input {
            flex: 1;
            padding: 1rem 1.25rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text);
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--primary-teal);
            box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.1);
        }

        .send-button {
            padding: 1rem 1.5rem;
            background: var(--primary-teal);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .send-button:hover {
            background: var(--teal-dark);
            transform: translateY(-1px);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }

        /* Responsive adjustments for sidebar collapse */
        @media (max-width: 1024px) {
            .chat-input-container {
                left: 70px;
            }
        }

        @media (max-width: 768px) {
            .chat-input-container {
                left: 0;
            }
        }
    </style>
</head>
<body>
    <!-- The shared-layout.js will inject sidebar and header here -->

    <!-- Welcome Screen (shown by default) -->
    <div id="welcome-screen" class="welcome-container">
        <!-- Will be populated by JS based on selected agent -->
    </div>

    <!-- Chat Interface (hidden until first message) -->
    <div id="chat-screen" class="chat-wrapper hidden">
        <div id="chat-messages" class="chat-messages"></div>
    </div>

    <!-- Chat Input (always visible) -->
    <div class="chat-input-container">
        <div class="chat-input-wrapper">
            <form id="message-form" class="input-form">
                <input
                    type="text"
                    id="message-input"
                    class="message-input"
                    placeholder="Type your message..."
                    autocomplete="off"
                />
                <button type="submit" id="send-button" class="send-button">Send</button>
            </form>
        </div>
    </div>

    <!-- Shared Layout Script (injects sidebar/header) -->
    <script src="/public/js/shared-layout.js" defer></script>

                prompts: [
                    { title: 'Audit Claim', description: 'Review expense eligibility', prompt: 'Audit this CanExport claim for eligibility and compliance' },
                    { title: 'Categorize Expenses', description: 'Check expense categories', prompt: 'Help me categorize these expenses according to CanExport rules' },

                prompts: [
                    { title: 'Eligibility Check', description: 'Verify BCAFE eligibility', prompt: 'Check if my agricultural export project is eligible for BCAFE' },
                    { title: 'Market Strategy', description: 'Develop export strategy', prompt: 'Help me develop a market entry strategy for BCAFE' },
                    { title: 'Draft Application', description: 'Create BCAFE application', prompt: 'Draft a BCAFE application for my export project' }
                ]
            },
            'buybc-writer': {
                name: 'Buy BC Partnership',
                subtitle: 'Buy BC Partnership Program application specialist',
                icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />',

                icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M20.893 13.393l-1.135-1.135a2.252 2.252 0 01-.421-.585l-1.08-2.16a.414.414 0 00-.663-.107.827.827 0 01-.812.21l-1.273-.363a.89.89 0 00-.738 1.595l.587.39c.59.395.674 1.23.172 1.732l-.2.2c-.212.212-.33.498-.33.796v.41c0 .409-.11.809-.32 1.158l-1.315 2.191a2.11 2.11 0 01-1.81 1.025 1.055 1.055 0 01-1.055-1.055v-1.172c0-.92-.56-1.747-1.414-2.089l-.655-.261a2.25 2.25 0 01-1.383-2.46l.007-.042a2.25 2.25 0 01.29-.787l.09-.15a2.25 2.25 0 012.37-1.048l1.178.236a1.125 1.125 0 001.302-.795l.208-.73a1.125 1.125 0 00-.578-1.315l-.665-.332-.091.091a2.25 2.25 0 01-1.591.659h-.18c-.249 0-.487.1-.662.274a.931.931 0 01-1.458-1.137l1.411-2.353a2.25 2.25 0 00.286-.76m11.928 9.869A9 9 0 008.965 3.525m11.928 9.868A9 9 0 118.965 3.525" />',

                prompts: [
                    { title: 'Readiness Assessment', description: 'Evaluate grant readiness', prompt: 'Assess our readiness for grant applications' },
                    { title: 'Strategy Development', description: 'Create funding strategy', prompt: 'Develop a strategic funding plan for our organization' },
                    { title: 'Gap Analysis', description: 'Identify improvement areas', prompt: 'Identify gaps in our grant application readiness' }

        // State
        let currentAgent = 'oracle';
        let conversationId = null;
        let messages = [];

        // Initialize
        function init() {
            // Parse URL: /{agent}/new or /{agent}/chat/{conversationId}
            const pathParts = window.location.pathname.split('/').filter(p => p);
            const agentFromPath = pathParts[0];
            const routeType = pathParts[1]; // 'new' or 'chat'
            const conversationIdFromPath = pathParts[2];

            // Set current agent
            if (AGENTS[agentFromPath]) {
                currentAgent = agentFromPath;
            }

            // If conversation ID in URL, load it
            if (routeType === 'chat' && conversationIdFromPath) {
                conversationId = conversationIdFromPath;
                loadConversation(conversationId);
            } else {
                // Show welcome screen for new chat
                renderWelcomeScreen();
            }

            setupEventListeners();
        }

        // Render welcome screen for current agent
        function renderWelcomeScreen() {
            const agent = AGENTS[currentAgent];
            const welcomeScreen = document.getElementById('welcome-screen');

            welcomeScreen.innerHTML = `
                <div class="welcome-icon">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        ${agent.icon}
                    </svg>
                </div>
                <h1 class="welcome-title">${agent.name}</h1>
                <p class="welcome-subtitle">${agent.subtitle}</p>
                <div class="welcome-prompts">
                    ${agent.prompts.map(p => `
                        <div class="welcome-prompt" onclick="sendPrompt('${p.prompt.replace(/'/g, "\\'")}')">
                            <div class="welcome-prompt-title">${p.title}</div>
                            <div class="welcome-prompt-description">${p.description}</div>
                        </div>
                    `).join('')}
                </div>
            `;

            // Update page title
            document.getElementById('page-title').textContent = `${agent.name} - GetGranted AI`;
        }

        // Switch agent
        window.switchAgent = function(agentType) {
            if (!AGENTS[agentType]) return;

            currentAgent = agentType;
            conversationId = null;
            messages = [];

            // Show welcome, hide chat
            document.getElementById('welcome-screen').classList.remove('hidden');
            document.getElementById('chat-screen').classList.add('hidden');
            document.getElementById('chat-messages').innerHTML = '';
            document.getElementById('message-input').value = '';

            renderWelcomeScreen();

            // Update URL without reload - use /agent/new format
            window.history.pushState({}, '', `/${agentType}/new`);

            // Update active nav item
            if (window.updateActiveNav) {
                window.updateActiveNav();
            }
        };

        // Setup event listeners
        function setupEventListeners() {
            document.getElementById('message-form').addEventListener('submit', handleSubmit);
        }

        // Handle form submission
        async function handleSubmit(e) {
            e.preventDefault();

            const input = document.getElementById('message-input');
            const message = input.value.trim();

            if (!message) return;

            // Clear input
            input.value = '';

            // Send message
            await sendMessage(message);
        }

        // Send a suggested prompt
        window.sendPrompt = async function(prompt) {
            await sendMessage(prompt);
        };

        // Send message to API
        async function sendMessage(message) {
            // Show chat screen (keep welcome visible - it will scroll up)
            const welcomeScreen = document.getElementById('welcome-screen');
            const chatScreen = document.getElementById('chat-screen');

            // On first message, hide welcome and show chat
            if (chatScreen.classList.contains('hidden')) {
                welcomeScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');
            }

            // Add user message to UI
            addMessageToUI('user', message);

            // Show thinking indicator
            const thinkingIndicator = addThinkingIndicator();

            // Disable input
            const sendButton = document.getElementById('send-button');
            const messageInput = document.getElementById('message-input');
            sendButton.disabled = true;
            messageInput.disabled = true;

            try {
                // Create conversation ID if needed (must be UUID for Postgres)
                const isFirstMessage = !conversationId;
                if (!conversationId) {
                    // Generate a proper UUID v4
                    conversationId = crypto.randomUUID();

                    // Update URL to /agent/chat/{conversationId} on first message
                    window.history.pushState({}, '', `/${currentAgent}/chat/${conversationId}`);
                }

                console.log('[DEBUG] Sending message:', {
                    message: message.substring(0, 50),
                    conversationId,
                    currentAgent,
                    backendAgent: getBackendAgentType(currentAgent)
                });

                // Call API
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    credentials: 'include', // Send cookies with request
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message,
                        conversationId,
                        agentType: getBackendAgentType(currentAgent)
                    })
                });

                console.log('[DEBUG] Response received:', response.status, response.ok);

                if (!response.ok) {
                    throw new Error('Failed to send message');
                }

                // Read streaming response
                console.log('[DEBUG] Starting to read stream...');
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let assistantMessage = '';
                let messageElement = null;
                let chunkCount = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    chunkCount++;
                    console.log(`[DEBUG] Chunk ${chunkCount}: done=${done}, bytes=${value?.length || 0}`);

                    if (done) {
                        console.log('[DEBUG] Stream ended, total message length:', assistantMessage.length);
                        break;
                    }

                    const chunk = decoder.decode(value);
                    console.log(`[DEBUG] Chunk text:`, chunk.substring(0, 100));
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') {
                                console.log('[DEBUG] Received [DONE] signal');
                                continue;
                            }

                            try {
                                const parsed = JSON.parse(data);
                                console.log('[DEBUG] Parsed SSE event:', parsed.type);

                                // Handle text delta events (actual response content)
                                if (parsed.type === 'text_delta' && parsed.text) {
                                    assistantMessage += parsed.text;

                                    // Create or update message element
                                    if (!messageElement) {
                                        console.log('[DEBUG] Creating assistant message element');
                                        // Remove thinking indicator when first response arrives
                                        if (thinkingIndicator && thinkingIndicator.parentNode) {
                                            thinkingIndicator.remove();
                                        }
                                        messageElement = addMessageToUI('assistant', '');
                                    }

                                    // Render markdown in real-time
                                    const contentElement = messageElement.querySelector('.message-content');
                                    if (typeof marked !== 'undefined') {
                                        contentElement.innerHTML = marked.parse(assistantMessage);
                                    } else {
                                        contentElement.textContent = assistantMessage;
                                    }

                                    // Auto-scroll
                                    const chatMessages = document.getElementById('chat-messages');
                                    chatMessages.scrollTop = chatMessages.scrollHeight;
                                }
                            } catch (e) {
                                console.error('[DEBUG] Parse error:', e, 'for line:', line);
                            }
                        }
                    }
                }

                // If no message element was created, show the collected message (defensive programming)
                if (!messageElement && assistantMessage) {
                    console.log('[DEBUG] Creating message element after stream ended');
                    if (thinkingIndicator && thinkingIndicator.parentNode) {
                        thinkingIndicator.remove();
                    }
                    addMessageToUI('assistant', assistantMessage);
                } else if (!messageElement && !assistantMessage) {
                    console.error('[DEBUG] No assistant message received!');
                    if (thinkingIndicator && thinkingIndicator.parentNode) {
                        thinkingIndicator.remove();
                    }
                    addMessageToUI('assistant', 'No response received from the assistant.');
                }
            } catch (error) {
                console.error('Error sending message:', error);
                // Remove thinking indicator on error
                if (thinkingIndicator && thinkingIndicator.parentNode) {
                    thinkingIndicator.remove();
                }
                addMessageToUI('assistant', 'Sorry, there was an error processing your message.');
            } finally {
                // Re-enable input
                sendButton.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        }

        // Load existing conversation from server
        async function loadConversation(convId) {
            try {
                const response = await fetch(`/api/conversations/${convId}`, {
                    credentials: 'include'
                });

                if (!response.ok) {
                    console.error('Failed to load conversation');
                    renderWelcomeScreen();
                    return;
                }

                const data = await response.json();

                // Hide welcome, show chat
                document.getElementById('welcome-screen').classList.add('hidden');
                document.getElementById('chat-screen').classList.remove('hidden');

                // Render messages
                const chatMessages = document.getElementById('chat-messages');
                chatMessages.innerHTML = '';

                if (data.messages && data.messages.length > 0) {
                    messages = data.messages;
                    messages.forEach(msg => {
                        addMessageToUI(msg.role, msg.content);
                    });
                }
            } catch (error) {
                console.error('Error loading conversation:', error);
                renderWelcomeScreen();
            }
        }

        // Add thinking indicator to UI
        function addThinkingIndicator() {
            const chatMessages = document.getElementById('chat-messages');
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'thinking-indicator';
            thinkingDiv.innerHTML = `
                <div class="thinking-spinner"></div>
                <div class="thinking-text">${AGENTS[currentAgent].name} is thinking...</div>
            `;
            chatMessages.appendChild(thinkingDiv);

            // Auto-scroll
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return thinkingDiv;
        }

        // Add message to UI
        function addMessageToUI(role, content) {
            const chatMessages = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            // Render markdown for assistant messages, plain text for user messages
            const renderedContent = role === 'assistant' && typeof marked !== 'undefined'
                ? marked.parse(content)
                : content.replace(/\n/g, '<br>');

            messageDiv.innerHTML = `
                <div class="message-role">${role === 'user' ? 'You' : AGENTS[currentAgent].name}</div>
                <div class="message-content">${renderedContent}</div>
            `;
            chatMessages.appendChild(messageDiv);

            // Auto-scroll
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return messageDiv;
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // Log version for debugging
        console.log('[VERSION] unified-agents.html v2026-02-03-13:40 (with thinking indicator) loaded');
    </script>
</body>
</html>
