<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Centre - Granted AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/shared-layout.css">
    <link rel="stylesheet" href="/public/css/control-centre.css">
</head>
<body>
    <!-- Wrapped by shared-layout.js; control-centre.js binds after that. Docs: docs/control-centre.md -->
    <main class="cc" id="cc">
        <header class="cc-head">
            <div class="cc-title">
                <p class="cc-eyebrow">Granted · GetGranted AI</p>
                <h1>Control Centre</h1>
            </div>
            <a class="cc-action" id="cc-action" href="#review" hidden><b id="cc-action-n">0</b><span>need action →</span></a>
        </header>

        <div class="cc-toolbar">
            <div class="cc-range" role="group" aria-label="Date range" id="cc-range">
                <button type="button" data-range="day">Day</button>
                <button type="button" data-range="week">Week</button>
                <button type="button" data-range="month">Month</button>
                <button type="button" data-range="year">Year</button>
            </div>
            <div class="cc-period" id="cc-period" aria-live="polite"></div>
            <div class="cc-search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input id="cc-search" type="search" placeholder="Find a company or grant by name or ID" autocomplete="off"
                       role="combobox" aria-expanded="false" aria-controls="cc-results" aria-label="Search companies and grants">
                <div class="cc-results" id="cc-results" role="listbox" hidden></div>
            </div>
        </div>

        <div class="cc-tabs-wrap" id="cc-tabs-wrap">
        <nav class="cc-tabs" role="tablist" aria-label="Control Centre sections" id="cc-tabs">
            <button class="cc-tab" role="tab" data-tab="overview">Overview</button>
            <button class="cc-tab" role="tab" data-tab="inbox">Inbox <span class="cc-badge" data-badge hidden></span></button>
            <button class="cc-tab" role="tab" data-tab="companies">Companies</button>
            <button class="cc-tab" role="tab" data-tab="grants">Grants</button>
            <button class="cc-tab" role="tab" data-tab="review">Review queue <span class="cc-badge" data-badge hidden></span></button>
            <button class="cc-tab" role="tab" data-tab="coverage">Coverage &amp; changes</button>
            <button class="cc-tab" role="tab" data-tab="themes">Chat themes</button>
        </nav>
        <button type="button" class="cc-tabs-more" id="cc-tabs-more" aria-label="Show more tabs" tabindex="-1">›</button>
        </div>

        <section id="cc-panel" role="tabpanel" aria-live="polite"></section>
    </main>

    <script src="/public/js/shared-layout.js"></script>
    <script src="/public/js/control-centre-review.js"></script>
    <script src="/public/js/control-centre-companies.js"></script>
    <script src="/public/js/control-centre-grants.js"></script>
    <script src="/public/js/control-centre-coverage.js"></script>
    <script src="/public/js/control-centre-chat.js"></script>
    <script src="/public/js/control-centre.js"></script>
</body>
</html>
