<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usage Analytics | Grant Writers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #fafaf9;
            --surface: #ffffff;
            --border: #e7e5e4;
            --text-primary: #1c1917;
            --text-secondary: #78716c;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 2rem;
            margin: -2rem -2rem 2rem -2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        .admin-badge {
            background: var(--error);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 0.75rem;
        }

        .back-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-link:hover {
            color: var(--primary-hover);
        }

        .time-filter {
            display: flex;
            gap: 0.5rem;
            background: var(--surface);
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border);
        }

        .time-filter button {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-primary);
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .time-filter button:hover {
            background: var(--background);
        }

        .time-filter button.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0.5rem 0;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-icon {
            font-size: 1.5rem;
            opacity: 0.8;
        }

        .section {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 0.75rem;
            background: var(--background);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1rem 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: var(--background);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .user-avatar {
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
        }

        .user-name {
            font-weight: 500;
        }

        .user-email {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-primary {
            background: #dbeafe;
            color: var(--primary);
        }

        .badge-success {
            background: #d1fae5;
            color: var(--success);
        }

        .badge-warning {
            background: #fef3c7;
            color: #d97706;
        }

        .loading {
            text-align: center;
            padding: 4rem 0;
            color: var(--text-secondary);
        }

        .loading-spinner {
            display: inline-block;
            width: 3rem;
            height: 3rem;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .agent-bar {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }

        .agent-name {
            min-width: 200px;
            font-weight: 500;
        }

        .progress-bar {
            flex: 1;
            height: 2rem;
            background: var(--background);
            border-radius: 0.5rem;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            padding: 0 0.75rem;
            color: white;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .metric {
            display: inline-block;
            margin-left: 1rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>
                    📊 Usage Analytics
                </h1>
                <p class="subtitle">Real-time platform usage and user activity metrics</p>
            </div>
            <a href="/dashboard" class="back-link">
                ← Back to Dashboard
            </a>
        </div>

        <div class="time-filter">
            <button onclick="setTimeRange(1)">Last 24 Hours</button>
            <button class="active" onclick="setTimeRange(7)">7 Days</button>
            <button onclick="setTimeRange(30)">One Month</button>
            <button onclick="setTimeRange(90)">Three Months</button>
        </div>

        <div id="overview-stats"></div>
        <div id="team-adoption"></div>
        <div id="productivity-impact"></div>
        <div id="individual-performance"></div>
    </div>

    <!-- Modal for user/agent details -->
    <div id="detailsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 1000; overflow: auto;">
        <div style="position: relative; background: white; margin: 2rem auto; max-width: 900px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);">
            <button onclick="closeDetailsModal()" style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-secondary);">×</button>
            <div id="modalContent" style="padding: 2rem;"></div>
        </div>
    </div>

    <script>
        // Version: 2025-12-02-v5 - Fixed time filter parameter validation
        console.log('📊 Usage Analytics v2025-12-02-v5 loaded');

        let currentDays = 7;
        let currentTimeFilter = '7days'; // Options: '24hours', '7days', '30days', '90days'

        async function setTimeRange(days) {
            currentDays = days;

            // Map days to filter name
            const filterMap = {
                1: '24hours',
                7: '7days',
                30: '30days',
                90: '90days'
            };
            currentTimeFilter = filterMap[days] || '7days';

            // Update active button
            document.querySelectorAll('.time-filter button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Reload data
            await loadAllData();
        }

        async function loadAllData() {
            await Promise.all([
                loadOverview(),
                loadTeamAdoption(),
                loadProductivityImpact(),
                loadIndividualPerformance()
            ]);
        }

        async function loadOverview() {
            const container = document.getElementById('overview-stats');
            container.innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>';

            try {
                const response = await fetch(`/api/usage-analytics?action=overview&days=${currentDays}`, {
                    credentials: 'include'
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Failed to load overview');
                }

                const data = await response.json();
                const stats = data.overview;

                container.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon">💬</div>
                            <div class="stat-value">${stats.totalConversations}</div>
                            <div class="stat-label">Total Conversations</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">👥</div>
                            <div class="stat-value">${stats.uniqueUsers}</div>
                            <div class="stat-label">Active Team Members</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">🤖</div>
                            <div class="stat-value">${stats.activeAgents}</div>
                            <div class="stat-label">Agents in Use</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">📝</div>
                            <div class="stat-value">${stats.totalMessages}</div>
                            <div class="stat-label">Total Messages</div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading overview:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <p>Error loading overview: ${error.message}</p>
                    </div>
                `;
            }
        }

        async function loadTeamAdoption() {
            const container = document.getElementById('team-adoption');
            container.innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>';

            try {
                const response = await fetch(`/api/usage-analytics?action=team-adoption&days=${currentDays}`, {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Failed to load team adoption');
                }

                const data = await response.json();
                console.log('📊 Team adoption data loaded:', {
                    days: currentDays,
                    filter: currentTimeFilter,
                    summary: data.summary,
                    timePeriodLabel: getTimePeriodLabel()
                });

                container.innerHTML = `
                    <div class="section">
                        <h3 class="section-title">👥 Team Adoption Dashboard</h3>
                        <div class="stats-grid" style="grid-template-columns: repeat(4, 1fr); margin-bottom: 2rem;">
                            <div class="stat-card">
                                <div class="stat-icon">👥</div>
                                <div class="stat-value">${data.summary.activeUsers}/${data.teamSize}</div>
                                <div class="stat-label">Active ${getTimePeriodLabel()}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon">✅</div>
                                <div class="stat-value">${data.summary.fullyAdopted}</div>
                                <div class="stat-label">Full Adoption</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon">⚠️</div>
                                <div class="stat-value">${data.summary.partialAdoption}</div>
                                <div class="stat-label">Partial Adoption</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon">❌</div>
                                <div class="stat-value">${data.summary.noUsage}</div>
                                <div class="stat-label">No Usage</div>
                            </div>
                        </div>

                        <h4 style="margin-bottom: 1rem; color: var(--text-secondary); font-size: 0.875rem;">Click on any user or agent for detailed breakdown</h4>
                        <table>
                            <thead>
                                <tr>
                                    <th>Team Member</th>
                                    ${data.availableAgents.map(agent => `
                                        <th style="text-align: center; cursor: pointer; transition: background 0.2s;"
                                            onclick="viewAgentDetails('${agent}')"
                                            onmouseover="this.style.background='var(--background)'"
                                            onmouseout="this.style.background='transparent'"
                                            title="Click to view ${formatAgentName(agent)} details">
                                            ${formatAgentName(agent)}
                                        </th>
                                    `).join('')}
                                    <th style="text-align: center;">Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.adoptionMatrix.map(user => `
                                    <tr style="cursor: pointer; transition: background 0.2s;"
                                        onmouseover="this.style.background='var(--background)'"
                                        onmouseout="this.style.background='transparent'">
                                        <td onclick="viewUserDetails(${user.userId}, '${user.name}')" title="Click to view ${user.name}'s usage">
                                            <div class="user-info">
                                                <img src="${user.picture || '/default-avatar.png'}" alt="${user.name}" class="user-avatar">
                                                <div>
                                                    <div class="user-name">${user.name}</div>
                                                    <div class="user-email" style="font-size: 0.75rem; color: var(--text-secondary);">
                                                        ${user.lastActivity ? 'Last active: ' + formatDate(user.lastActivity) : 'No activity'}
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                        ${data.availableAgents.map(agent => {
                                            const usage = user.agentUsage[agent];

                                            // Determine if checkmark should show based on current time filter
                                            let showCheckmark = false;
                                            if (currentTimeFilter === '24hours') {
                                                showCheckmark = usage.usedLastDay;
                                            } else if (currentTimeFilter === '7days') {
                                                showCheckmark = usage.usedLastWeek;
                                            } else if (currentTimeFilter === '30days') {
                                                showCheckmark = usage.usedLastMonth;
                                            } else if (currentTimeFilter === '90days') {
                                                showCheckmark = usage.usedLast3Months;
                                            }

                                            // Build tooltip text
                                            const tooltipText = usage.lastUsed
                                                ? `Last used: ${formatDate(usage.lastUsed)}\\n${usage.conversationCount} conversation${usage.conversationCount !== 1 ? 's' : ''} total`
                                                : 'Never used';

                                            return `
                                                <td style="text-align: center;">
                                                    ${showCheckmark
                                                        ? `<span style="color: var(--success); font-size: 1.25rem; cursor: help;" title="${tooltipText}">✓</span>`
                                                        : `<span style="color: var(--text-secondary); opacity: 0.3;" title="${tooltipText}">—</span>`
                                                    }
                                                </td>
                                            `;
                                        }).join('')}
                                        <td style="text-align: center;">
                                            <strong>${user.totalAgentsUsed}/${data.availableAgents.length}</strong>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading team adoption:', error);
                container.innerHTML = `
                    <div class="section">
                        <h3 class="section-title">👥 Team Adoption Dashboard</h3>
                        <div class="empty-state">
                            <div class="empty-state-icon">⚠️</div>
                            <p>Error loading team adoption</p>
                        </div>
                    </div>
                `;
            }
        }

        async function loadProductivityImpact() {
            const container = document.getElementById('productivity-impact');
            container.innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>';

            try {
                const response = await fetch(`/api/usage-analytics?action=productivity-impact&days=${currentDays}`, {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Failed to load productivity metrics');
                }

                const data = await response.json();

                container.innerHTML = `
                    <div class="section">
                        <h3 class="section-title">⚡ Productivity & Impact</h3>

                        <h4 style="margin-bottom: 1rem; color: var(--text-primary);">Average Time per Agent</h4>
                        ${data.agentProductivity.map(agent => `
                            <div class="agent-bar">
                                <div class="agent-name">${formatAgentName(agent.agentType)}</div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: 100%; background: var(--info);">
                                        ${agent.avgDurationMinutes.toFixed(0)} min average
                                    </div>
                                </div>
                                <span class="metric">${agent.totalConversations} conversations</span>
                                <span class="metric">${agent.conversationsPerUser} per user</span>
                            </div>
                        `).join('')}

                        <h4 style="margin-top: 2rem; margin-bottom: 1rem; color: var(--text-primary);">Weekly Conversations per Person</h4>
                        <table>
                            <thead>
                                <tr>
                                    <th>Team Member</th>
                                    <th>Avg Conversations/Week</th>
                                    <th>Last 4 Weeks</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.userProductivity.map(user => `
                                    <tr>
                                        <td>${user.name}</td>
                                        <td><strong>${user.avgConversationsPerWeek}</strong></td>
                                        <td>
                                            ${user.weeks.map(w => `
                                                <span class="badge badge-primary" style="margin-right: 0.25rem;">${w.conversationsCompleted}</span>
                                            `).join('')}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>

                        ${data.qualityTrends.length > 0 ? `
                            <h4 style="margin-top: 2rem; margin-bottom: 1rem; color: var(--text-primary);">Quality Trends</h4>
                            <div style="background: var(--background); padding: 1rem; border-radius: 0.5rem;">
                                ${data.qualityTrends.slice(0, 7).map(trend => `
                                    <div style="display: flex; justify-content: space-between; padding: 0.5rem; border-bottom: 1px solid var(--border);">
                                        <span>${formatDate(trend.date)}</span>
                                        <span style="color: var(--success);">${trend.positiveRate || 'N/A'}% positive</span>
                                        <span>Quality: ${trend.avgQuality || 'N/A'}</span>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            } catch (error) {
                console.error('Error loading productivity metrics:', error);
                container.innerHTML = `
                    <div class="section">
                        <h3 class="section-title">⚡ Productivity & Impact</h3>
                        <div class="empty-state">
                            <div class="empty-state-icon">⚠️</div>
                            <p>Error loading productivity metrics</p>
                        </div>
                    </div>
                `;
            }
        }

        async function loadIndividualPerformance() {
            const container = document.getElementById('individual-performance');
            container.innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>';

            try {
                const response = await fetch(`/api/usage-analytics?action=individual-performance&days=${currentDays}`, {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Failed to load individual performance');
                }

                const data = await response.json();

                container.innerHTML = `
                    <div class="section">
                        <h3 class="section-title">🏆 Individual Performance</h3>

                        <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr); margin-bottom: 2rem;">
                            <div class="stat-card">
                                <div class="stat-icon">👥</div>
                                <div class="stat-value">${data.teamStats.activeUsers}</div>
                                <div class="stat-label">Active Users</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon">💬</div>
                                <div class="stat-value">${data.teamStats.avgMessagesPerConv}</div>
                                <div class="stat-label">Avg Messages/Conversation</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon">⭐</div>
                                <div class="stat-value">${data.teamStats.teamAvgQuality}</div>
                                <div class="stat-label">Team Avg Quality</div>
                            </div>
                        </div>

                        ${data.usersNeedingSupport.length > 0 ? `
                            <h4 style="margin-bottom: 1rem; color: var(--warning);">⚠️ Users Needing Support</h4>
                            <div style="display: grid; gap: 1rem; margin-bottom: 2rem;">
                                ${data.usersNeedingSupport.map(user => `
                                    <div style="padding: 1rem; background: #fef3c7; border-left: 4px solid var(--warning); border-radius: 0.5rem;">
                                        <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem;">
                                            <img src="${user.picture}" alt="${user.name}" class="user-avatar">
                                            <div>
                                                <strong>${user.name}</strong>
                                                <div style="font-size: 0.875rem; color: var(--text-secondary);">${user.email}</div>
                                            </div>
                                        </div>
                                        <div style="display: flex; gap: 1rem; font-size: 0.875rem;">
                                            <span>Quality: ${user.avgQuality}</span>
                                            <span>Revisions: ${user.avgRevisions}</span>
                                            <span>Negative feedback: ${user.negativeFeedbackCount}</span>
                                        </div>
                                        <div style="margin-top: 0.5rem; font-size: 0.875rem; color: var(--warning);">
                                            Issues: ${user.issues.join(', ')}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : '<p style="color: var(--success); margin-bottom: 2rem;">✅ All team members performing well!</p>'}

                        <h4 style="margin-bottom: 1rem; color: var(--text-primary);">Top Users by Agent</h4>
                        ${Object.keys(data.topUsersByAgent).map(agentType => `
                            <div style="margin-bottom: 1.5rem;">
                                <h5 style="margin-bottom: 0.5rem; color: var(--text-secondary);">${formatAgentName(agentType)}</h5>
                                <div style="display: grid; gap: 0.5rem;">
                                    ${data.topUsersByAgent[agentType].slice(0, 3).map((user, idx) => `
                                        <div style="padding: 0.75rem; background: var(--background); border-left: 3px solid ${idx === 0 ? '#FFD700' : idx === 1 ? '#C0C0C0' : '#CD7F32'}; border-radius: 0.375rem; display: flex; justify-content: space-between; align-items: center;">
                                            <div class="user-info">
                                                <img src="${user.picture}" alt="${user.name}" class="user-avatar">
                                                <div>
                                                    <div class="user-name">${user.name}</div>
                                                </div>
                                            </div>
                                            <div style="text-align: right; font-size: 0.875rem;">
                                                <div><strong>${user.conversationCount}</strong> conversations</div>
                                                <div style="color: var(--text-secondary);">Quality: ${user.avgQuality}</div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (error) {
                console.error('Error loading individual performance:', error);
                container.innerHTML = `
                    <div class="section">
                        <h3 class="section-title">🏆 Individual Performance</h3>
                        <div class="empty-state">
                            <div class="empty-state-icon">⚠️</div>
                            <p>Error loading individual performance</p>
                        </div>
                    </div>
                `;
            }
        }

        function formatAgentName(agentType) {
            const names = {
                'etg-writer': 'ETG Business Case Writer',
                'grant-card-generator': 'Grant Card Generator',
                'canexport-claims': 'CanExport Claims Auditor',
                'bcafe-writer': 'BC Agriculture & Food Export',
                'readiness-strategist': 'Grant Readiness Strategist',
                'canexport-writer': 'CanExport Application Writer'
            };
            return names[agentType] || agentType;
        }

        function getAgentUrl(agentType) {
            const urls = {
                'grant-card-generator': '/grant-cards',
                'etg-writer': '/etg-agent',
                'bcafe-writer': '/bcafe-agent',
                'canexport-claims': '/canexport-claims',
                'readiness-strategist': '/readiness-strategist',
                'canexport-writer': '/canexport-writer'
            };
            return urls[agentType] || '/';
        }

        function openConversation(conversationId, agentType) {
            const baseUrl = getAgentUrl(agentType);
            const url = `${baseUrl}/chat/${conversationId}`;
            console.log('🔗 Opening conversation:', { conversationId, agentType, url });
            window.open(url, '_blank');
        }

        function formatDuration(minutes) {
            if (minutes < 60) {
                return `${Math.round(minutes)} min`;
            }
            const hours = Math.floor(minutes / 60);
            const mins = Math.round(minutes % 60);
            return `${hours}h ${mins}m`;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);

            if (diffMins < 60) {
                return `${diffMins} min ago`;
            } else if (diffMins < 1440) {
                return `${Math.floor(diffMins / 60)} hours ago`;
            } else {
                return date.toLocaleDateString();
            }
        }

        function getTimePeriodLabel() {
            const labels = {
                '24hours': 'Last 24 Hours',
                '7days': 'This Week',
                '30days': 'This Month',
                '90days': 'Last 3 Months'
            };
            return labels[currentTimeFilter] || 'This Week';
        }

        // Modal functions
        let currentModalContext = null; // Store what's currently being viewed

        function closeDetailsModal() {
            document.getElementById('detailsModal').style.display = 'none';
            currentModalContext = null;
        }

        function openDetailsModal() {
            document.getElementById('detailsModal').style.display = 'block';
        }

        // Click outside modal to close
        document.getElementById('detailsModal')?.addEventListener('click', (e) => {
            if (e.target.id === 'detailsModal') {
                closeDetailsModal();
            }
        });

        // Generate time filter buttons for modal
        function getModalTimeFilterButtons() {
            const filters = [
                { days: 1, label: 'Last 24 Hours' },
                { days: 7, label: '7 Days' },
                { days: 30, label: 'One Month' },
                { days: 90, label: 'Three Months' }
            ];

            return `
                <div class="time-filter" style="margin-bottom: 1.5rem;">
                    ${filters.map(filter => `
                        <button
                            class="${currentDays === filter.days ? 'active' : ''}"
                            onclick="changeModalTimeFilter(${filter.days})">
                            ${filter.label}
                        </button>
                    `).join('')}
                </div>
            `;
        }

        // Change time filter from within modal
        async function changeModalTimeFilter(days) {
            // Ensure days is a number
            const daysNum = parseInt(days);
            console.log('📊 Changing modal time filter:', { days, daysNum, type: typeof days });

            currentDays = daysNum;
            const filterMap = {
                1: '24hours',
                7: '7days',
                30: '30days',
                90: '90days'
            };
            currentTimeFilter = filterMap[daysNum] || '7days';

            // Reload modal content with new time filter
            if (currentModalContext) {
                if (currentModalContext.type === 'user') {
                    await viewUserDetails(currentModalContext.userId, currentModalContext.userName);
                } else if (currentModalContext.type === 'agent') {
                    await viewAgentDetails(currentModalContext.agentType);
                }
            }
        }

        // View user details
        async function viewUserDetails(userId, userName) {
            // Store context for time filter changes
            currentModalContext = { type: 'user', userId, userName };

            // Ensure currentDays is a valid number
            const validDays = parseInt(currentDays) || 7;
            console.log('📊 Opening user details modal:', { userId, userName, currentDays, validDays, currentTimeFilter });

            openDetailsModal();
            document.getElementById('modalContent').innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>Loading user details...</p></div>';

            try {
                const url = `/api/usage-analytics?action=user-details&userId=${userId}&days=${validDays}`;
                console.log('📊 Fetching user details from:', url);

                const response = await fetch(url, {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Failed to load user details');
                }

                const data = await response.json();
                console.log('📊 User details loaded:', data);

                document.getElementById('modalContent').innerHTML = `
                    <h2 style="margin-bottom: 1rem; color: var(--primary);">📊 ${userName}'s Usage (${getTimePeriodLabel()})</h2>

                    ${getModalTimeFilterButtons()}

                    <div class="stats-grid" style="grid-template-columns: repeat(4, 1fr); margin-bottom: 2rem;">
                        <div class="stat-card">
                            <div class="stat-icon">💬</div>
                            <div class="stat-value">${data.totalConversations}</div>
                            <div class="stat-label">Conversations</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">🤖</div>
                            <div class="stat-value">${data.agentsUsed}</div>
                            <div class="stat-label">Agents Used</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">⏱️</div>
                            <div class="stat-value">${formatDuration(data.totalMinutes)}</div>
                            <div class="stat-label">Total Time</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">📅</div>
                            <div class="stat-value">${formatDate(data.lastActivity)}</div>
                            <div class="stat-label">Last Active</div>
                        </div>
                    </div>

                    <h3 style="margin-bottom: 1rem;">Usage by Agent</h3>
                    ${data.agentBreakdown.map(agent => `
                        <div class="agent-bar" style="margin-bottom: 0.5rem;">
                            <div class="agent-name">${formatAgentName(agent.agentType)}</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${(agent.conversations / data.totalConversations) * 100}%;">
                                    ${agent.conversations} conversations
                                </div>
                            </div>
                            <span class="metric">${formatDuration(agent.avgDuration)} avg</span>
                        </div>
                    `).join('')}

                    <h3 style="margin-top: 2rem; margin-bottom: 1rem;">Recent Activity</h3>
                    <table style="width: 100%;">
                        <thead>
                            <tr>
                                <th>Agent</th>
                                <th>Date</th>
                                <th>Messages</th>
                                <th>Duration</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.recentConversations.map(conv => `
                                <tr style="cursor: pointer; transition: background 0.2s;"
                                    onmouseover="this.style.background='var(--background)'"
                                    onmouseout="this.style.background='transparent'"
                                    onclick="openConversation('${conv.id}', '${conv.agentType}')"
                                    title="Click to open this conversation">
                                    <td>${formatAgentName(conv.agentType)}</td>
                                    <td>${formatDate(conv.createdAt)}</td>
                                    <td>${conv.messageCount}</td>
                                    <td>${formatDuration(conv.duration)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (error) {
                console.error('Error loading user details:', error);
                document.getElementById('modalContent').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <p>Error loading user details</p>
                    </div>
                `;
            }
        }

        // View agent details
        async function viewAgentDetails(agentType) {
            // Store context for time filter changes
            currentModalContext = { type: 'agent', agentType };

            // Ensure currentDays is a valid number
            const validDays = parseInt(currentDays) || 7;
            console.log('📊 Opening agent details modal:', { agentType, currentDays, validDays, currentTimeFilter });

            openDetailsModal();
            document.getElementById('modalContent').innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>Loading agent details...</p></div>';

            try {
                const url = `/api/usage-analytics?action=agent-details&agentType=${agentType}&days=${validDays}`;
                console.log('📊 Fetching agent details from:', url);

                const response = await fetch(url, {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Failed to load agent details');
                }

                const data = await response.json();

                document.getElementById('modalContent').innerHTML = `
                    <h2 style="margin-bottom: 1rem; color: var(--primary);">🤖 ${formatAgentName(agentType)} (${getTimePeriodLabel()})</h2>

                    ${getModalTimeFilterButtons()}

                    <div class="stats-grid" style="grid-template-columns: repeat(4, 1fr); margin-bottom: 2rem;">
                        <div class="stat-card">
                            <div class="stat-icon">💬</div>
                            <div class="stat-value">${data.totalConversations}</div>
                            <div class="stat-label">Conversations</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">👥</div>
                            <div class="stat-value">${data.uniqueUsers}</div>
                            <div class="stat-label">Users</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">⏱️</div>
                            <div class="stat-value">${formatDuration(data.avgDuration)}</div>
                            <div class="stat-label">Avg Duration</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">📝</div>
                            <div class="stat-value">${data.avgMessages}</div>
                            <div class="stat-label">Avg Messages</div>
                        </div>
                    </div>

                    <h3 style="margin-bottom: 1rem;">🏆 Top Users</h3>
                    ${data.topUsers.map((user, idx) => `
                        <div style="padding: 0.75rem; background: var(--background); border-left: 3px solid ${idx === 0 ? '#FFD700' : idx === 1 ? '#C0C0C0' : '#CD7F32'}; border-radius: 0.375rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center;">
                            <div class="user-info">
                                <img src="${user.picture}" alt="${user.name}" class="user-avatar">
                                <div>
                                    <div class="user-name">${user.name}</div>
                                </div>
                            </div>
                            <div style="text-align: right;">
                                <div><strong>${user.conversations}</strong> conversations</div>
                                <div style="font-size: 0.875rem; color: var(--text-secondary);">${formatDuration(user.totalTime)}</div>
                            </div>
                        </div>
                    `).join('')}

                    <h3 style="margin-top: 2rem; margin-bottom: 1rem;">📈 Usage Trend</h3>
                    <div style="background: var(--background); padding: 1rem; border-radius: 0.5rem;">
                        ${data.dailyUsage.map(day => `
                            <div style="display: flex; justify-content: space-between; padding: 0.5rem; border-bottom: 1px solid var(--border);">
                                <span>${formatDate(day.date)}</span>
                                <span><strong>${day.conversations}</strong> conversations</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (error) {
                console.error('Error loading agent details:', error);
                document.getElementById('modalContent').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <p>Error loading agent details</p>
                    </div>
                `;
            }
        }

        // Load data on page load
        loadAllData();
    </script>
</body>
</html>
